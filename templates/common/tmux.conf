# managed-by: evo-t1-coder-stack -- stack-seeded. Delete this line (or the
# whole file) to take terminal fidelity over: the workspace boot reseeds this
# file only while the marker line above is present.

# The click belongs to the terminal you type in, so copy and paste behave as
# they would in a native terminal on the machine you are sitting at. tmux asks
# the outer terminal for mouse reporting only while this option is on; with it
# off tmux never sees a button, so the client keeps every one of them -- a drag
# is the client's own highlight, the settings seed's copyOnSelection puts that
# highlight on the machine's clipboard with no chord, right-click asks that
# clipboard for a paste, and middle-click pastes it. tmux paints in the
# alternate screen, so the client holds no scrollback of its own and a wheel
# over a pane has nothing to walk: Prefix-[ and the vi keys below bring
# history onto the screen, and Prefix m is the switch for a long scroll. Pane
# selection by click, resize by drag and the pane menu keep their prefix keys
# -- Prefix-o, Prefix-q, Prefix-Alt-arrow.
#
# Measured on the shipped tmux 3.4: an attach with `mouse on` writes the three
# pointer reports ESC[?1000h, ESC[?1002h and ESC[?1006h to the outer terminal
# and an attach with it off writes none of them, while ESC[?1049h goes out
# either way because tmux paints in the alternate screen.
#
# Each option below carries its own one-line reason; the measurements behind
# them are in docs/coder-templates.md, "The tmux seed and the clipboard route".
set -g mouse off
bind-key m set -g mouse \; display-message -d 4000 'mouse #{?mouse,on,off} -- on hands the wheel to tmux, off leaves the click with the client'

# tmux keeps no clipboard of its own. The machine's clipboard is the only one
# in play and the client is what reads and writes it, so every binding that
# could move text into or out of a tmux buffer is unbound: the vi copy-mode
# copies, the prefix paste and buffer picker, and the middle-click paste in the
# root table. Prefix-[ stays a viewer without them.
#
# set-clipboard is the one copy route that is not tmux's own: an app inside a
# pane (vim's + register, anything that emits OSC 52) drives the machine
# clipboard through it, which is what a native terminal hands that app.
set -g set-clipboard on

# Passthrough is scoped to the window that asks for it instead of being on for
# every pane. Every attached client here is a full renderer -- one browser tab,
# one xterm.js, one WebSocket -- and with this option on the server copies
# every DCS-wrapped sequence any pane emits to every one of those clients, the
# ones that stopped draining included. The clipboard needs none of it
# (set-clipboard above), so the default here is off and an app that really
# wants its own sequences presses Prefix p -- in the window that runs it, which
# is the only window that then pays.
set -g allow-passthrough off
bind-key p if-shell -F '#{==:#{allow-passthrough},on}' 'setw allow-passthrough off' 'setw allow-passthrough on' \; display-message -d 4000 'passthrough #{allow-passthrough} -- on hands this window DCS-wrapped sequences, off drops them'

# Color and key fidelity through the multiplexer. tmux rewrites 24-bit color
# down to the palette the attached client advertises, so a theme reads washed
# out in the browser even when the app inside emits truecolor; the RGB feature
# turns that rewrite off. extkeys is what lets Shift+Enter and Ctrl+. reach the
# pane distinct from Enter, and tmux's stock xterm* entry omits it. Together
# with set-clipboard and allow-passthrough above these cover the options
# `grok doctor` writes fixes for, and extkeys is the one Doctor leaves to the
# operator. A client reads terminal-features only at attach, so after a reseed:
# tmux source-file ~/.tmux.conf, then detach and reattach. tmux 3.5 and later
# also want `set -s extended-keys-format csi-u`; the image ships 3.4, which
# rejects that option.
set -g extended-keys on
set -as terminal-features ',*:RGB'
set -as terminal-features 'xterm*:extkeys'

# vi copy-mode, which is now a viewer rather than a copier: Prefix-[ enters it,
# the cursor keys, PPage/NPage, C-u/C-d and k/j walk history, q leaves. tmux's
# own paste of a copied selection goes with it -- Prefix-] and the buffer picker
# are unbound, and the client's own Ctrl+Shift+V or right-click is what puts text
# into the pane. Unbinding a key tmux never bound is silent, so the list names
# every route text took, including the y the earlier seed bound itself.
setw -g mode-keys vi
bind-key -T copy-mode-vi Escape send-keys -X clear-selection
unbind-key -T copy-mode-vi Enter
unbind-key -T copy-mode-vi C-j
unbind-key -T copy-mode-vi y
unbind-key -T copy-mode-vi D
unbind-key -T copy-mode-vi A
unbind-key -T copy-mode-vi DoubleClick1Pane
unbind-key -T copy-mode-vi TripleClick1Pane
unbind-key -T copy-mode-vi MouseDrag1Pane
unbind-key -T copy-mode-vi MouseDragEnd1Pane
unbind-key -T prefix ']'
unbind-key -T prefix =
unbind-key -T root MouseDown2Pane

# One history per pane, deep enough that a reattached terminal still reaches the
# output a closed tab produced and that Prefix-[ still finds the start of a
# build. tmux applies the number to panes created from now on, so an existing
# pane keeps the limit it was born with (tmux(1)); a new pane or a
# `tmux kill-server` is what takes a raise.
set -g history-limit 100000

# Every attached client is a full renderer: on this stack one browser tab
# equals one xterm.js on the other end of a WebSocket, re-parsing whatever
# tmux paints for that client. focus-events is what tells tmux which of them
# the human is looking at: without it tmux sees keystrokes only, so it has no
# focused client to size a window by and nothing to blame for a pane app that
# keeps animating. The sequence is forwarded to the pane too, so a TUI can idle
# on blur. tmux(1) wants clients detached and reattached after it changes.
#
# aggressive-resize is deliberately left at its default. Its own entry in
# options-table.c scopes it to `window-size smallest` and `manual`, and the
# default `latest` already sizes the current window from the client with the
# most recent activity, so under `latest` it would change nothing here while
# tmux(1) warns it is "poor for interactive programs such as shells".
set -g focus-events on

# The status timer is the server's own periodic work: every status-interval
# seconds it re-expands the status line and runs the redraw pass for every
# attached client, the ones that stopped draining included. This tmux ships it
# at 15, while the stock status-right ("%H:%M %d-%b-%y") can only change on a
# minute boundary or on a window, title or flag event -- so 3 of the stock 4
# ticks a minute re-expand a string that cannot have changed, and each tick is
# a redraw pushed at every client, the stalled ones included. 60 is the finest
# step that string can show, so the clock stays right on one tick a minute.
# The scope flag matters and only this one works: the same number written
# `set -s status-interval` is dropped at config load, so it stays with -g and a
# live server takes it on `tmux source-file ~/.tmux.conf`.
set -g status-interval 60

# Pinned rather than changed: off is what this build already defaults to, and
# the seed says so in the file the operator reads. The pane's app keeps its
# window name -- allow-rename is left alone -- and tmux never re-writes the
# attached client's title, which is one less string pushed at every client
# every time a pane's title moves.
set -g set-titles off

# Nothing in the 3.4 option set bounds a client that stops draining, and the
# two pruning options it does carry are both unusable here, so neither is
# shipped: destroy-unattached and exit-unattached both destroy the session the
# moment its last client detaches, taking everything running in it, which is
# the opposite of what the two launchers need -- a closed tab leaves its
# session unattached for the next tab to rejoin. The stale-client sweep in
# those two scripts is what reaps a client like this.

# Key and focus latency. tmux holds back any Escape it reads for escape-time to
# see whether more of a sequence follows, and 3.4 ships that at 500 ms: Alt,
# the arrow keys and Esc itself feel like dropped input, and a focus-in can
# wait that long before tmux repaints. Upstream cut the default to 10 ms in
# 3.5 (CHANGES), and that is the number pinned here, not the 0 vim guides
# recommend: at 10 a keystroke is never held, while 0 splits an Esc from the
# character behind it. Server option, so `tmux source-file ~/.tmux.conf` moves
# it for live panes.
set -s escape-time 10
