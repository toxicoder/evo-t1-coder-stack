# managed-by: evo-t1-coder-stack -- stack-seeded. Delete this line (or the
# whole file) to take terminal fidelity over: the workspace boot reseeds this
# file only while the marker line above is present.

# The click belongs to the terminal you type in, so copy and paste behave as they
# would in a native terminal on the machine you are sitting at. tmux asks the
# outer terminal for mouse reporting only while this option is on: measured on the
# shipped tmux 3.4, an attach with `mouse on` writes ESC[?1000h, ESC[?1002h and
# ESC[?1006h to the client, and an attach with it off writes none of them. With it
# off tmux never sees a button, so the client keeps every one of them -- a drag is
# the client's own highlight, the settings seed's copyOnSelection puts that
# highlight on the machine's clipboard with no chord, right-click asks that
# clipboard for a paste, and middle-click pastes it -- and tmux has no pointer to
# highlight-copy with or middle-click-paste from.
#
# The wheel is the one thing tmux's pointer was doing here. tmux paints in the
# alternate screen (it sends ESC[?1049h either way), so the client holds no
# scrollback of its own and a wheel over a pane has nothing to walk. Scrolled-back
# output comes onto the screen with Prefix-[ and the vi keys below, where a client
# drag can reach it, and Prefix m is the switch for a long scroll: one press hands
# the pointer to tmux so the wheel walks history, the next hands it back. Pane
# selection by click, resize by drag and the right-click pane menu also wanted the
# pointer; they keep their prefix keys -- Prefix-o to cycle or Prefix-q to pick a
# pane by number, Prefix-Alt-arrow to resize.
set -g mouse off
bind-key m set -g mouse \; display-message -d 4000 'mouse #{?mouse,on,off} -- on hands the wheel to tmux, off leaves the click with the client'

# tmux keeps no clipboard of its own. The machine's clipboard is the only one in
# play and the client is what reads and writes it, so every binding that could
# move text into or out of a tmux buffer is unbound: the vi copy-mode copies
# (Enter and C-j, D, A, the word and line copies a double- or triple-click fires,
# and the copy a drag release used to run), the prefix paste and buffer picker,
# and the middle-click paste in the root table. Prefix-[ stays a viewer without
# them. Selecting inside it with Space, V or the cursor keys stays bound and is
# inert, with no copy command left for it to end on.
#
# set-clipboard and allow-passthrough stay on for the one copy route that is not
# tmux's own: an app inside a pane (vim's + register, anything that emits OSC 52)
# drives the machine clipboard through them, which is what a native terminal hands
# that app. tmux itself has nothing left to send, so an accidental tmux copy
# cannot overwrite what the client just put on the clipboard.
set -g set-clipboard on
set -g allow-passthrough on

# Color and key fidelity through the multiplexer. tmux rewrites 24-bit color
# down to the palette the attached client advertises, so a theme reads washed
# out in the browser even when the app inside emits truecolor; the RGB feature
# turns that rewrite off. extkeys is what lets Shift+Enter and Ctrl+. reach the
# pane distinct from Enter, and tmux's stock xterm* entry omits it. Together
# with set-clipboard and allow-passthrough above these cover the options
# `grok doctor` writes fixes for, and extkeys is the one Doctor leaves to the
# operator. A client reads terminal-features only at attach, so after a reseed:
# tmux source-file ~/.tmux.conf, then detach and reattach. tmux 3.5 and later
# also want `set -s extended-keys-format csi-u`; the image ships 3.4, which
# rejects that option.
set -g extended-keys on
set -as terminal-features ',*:RGB'
set -as terminal-features 'xterm*:extkeys'

# vi copy-mode, which is now a viewer rather than a copier: Prefix-[ enters it,
# the cursor keys, PPage/NPage, C-u/C-d and k/j walk history, q leaves. tmux's
# own paste of a copied selection goes with it -- Prefix-] and the buffer picker
# are unbound, and the client's own Ctrl+Shift+V or right-click is what puts text
# into the pane. Unbinding a key tmux never bound is silent, so the list names
# every route text took, including the y the earlier seed bound itself.
setw -g mode-keys vi
bind-key -T copy-mode-vi Escape send-keys -X clear-selection
unbind-key -T copy-mode-vi Enter
unbind-key -T copy-mode-vi C-j
unbind-key -T copy-mode-vi y
unbind-key -T copy-mode-vi D
unbind-key -T copy-mode-vi A
unbind-key -T copy-mode-vi DoubleClick1Pane
unbind-key -T copy-mode-vi TripleClick1Pane
unbind-key -T copy-mode-vi MouseDrag1Pane
unbind-key -T copy-mode-vi MouseDragEnd1Pane
unbind-key -T prefix ']'
unbind-key -T prefix =
unbind-key -T root MouseDown2Pane

# One history per pane, deep enough that a reattached terminal still reaches the
# output a closed tab produced and that Prefix-[ still finds the start of a
# build. Measured on the shipped tmux 3.4 with one saturated pane: 50000 lines
# of 120-column output holds the server at 193 MB, 100000 at 381 MB, and the
# same 100000 lines of plain 80-column output costs 60 MB. tmux applies the
# number to panes created from now on, so an existing pane keeps the limit it
# was born with (tmux(1)); a new pane or a `tmux kill-server` is what takes a
# raise.
set -g history-limit 100000

# Every attached client is a full renderer: on this stack one browser tab
# equals one xterm.js on the other end of a WebSocket, re-parsing whatever
# tmux paints for that client. focus-events is what tells tmux which of them
# the human is looking at: without it tmux sees keystrokes only, so it has no
# focused client to size a window by and nothing to blame for a pane app that
# keeps animating. The sequence is forwarded to the pane too, so a TUI can idle
# on blur. tmux(1) wants clients detached and reattached after it changes.
#
# aggressive-resize is deliberately left at its default. Its own entry in
# options-table.c scopes it to `window-size smallest` and `manual`, and the
# default `latest` already sizes the current window from the client with the
# most recent activity -- resize.c consults aggressive-resize only as a filter
# over those clients -- so under `latest` it would change nothing here while
# tmux(1) warns it is "poor for interactive programs such as shells".
set -g focus-events on

# Key and focus latency. tmux holds back any Escape it reads for escape-time to
# see whether more of a sequence follows, and 3.4 ships that at 500 ms: Alt,
# the arrow keys and Esc itself feel like dropped input, and a focus-in can
# wait that long -- twice, with set-timing -- before tmux repaints. Upstream
# cut the default to 10 ms in 3.5 (CHANGES), and that is the number pinned
# here, not the 0 vim guides recommend: at 10 a keystroke is never held, while
# 0 splits an Esc from the character behind it whenever a throttled background
# tab delivers the two more than 10 ms apart, which loses every Alt chord
# (measured on this build: Esc, 300 ms, q fires M-q at 500 and not at 10).
# Server option, so `tmux source-file ~/.tmux.conf` moves it for live panes.
set -s escape-time 10
