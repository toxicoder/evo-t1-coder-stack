# managed-by: evo-t1-coder-stack -- stack-seeded. Delete this line (or the
# whole file) to take terminal fidelity over: the workspace boot reseeds this
# file only while the marker line above is present.

# Scrolling belongs to tmux: the wheel walks copy-mode history and a drag starts
# a tmux selection. That is what makes the wheel behave in a browser tab, and it
# is also why a copy out needs the modifier below.
set -g mouse on

# Copy and paste between a pane and the machine you type on.
#
# Out of the pane, in a browser tab: hold Shift and drag. xterm.js hands a
# Shift+drag to the browser as a native selection even while tmux owns the
# pointer, and the settings seed's copyOnSelection then puts it on the system
# clipboard with no chord. Measured in headless Chromium against code-server
# 4.145.0 with this file loaded: Shift+drag called
# navigator.clipboard.writeText and left tmux's buffer empty, a plain drag went
# the other way (tmux buffer, no browser selection), and Alt and Ctrl drags
# reached neither side. One click clears a leftover selection first -- Shift
# extends a selection that exists instead of starting another.
#
# OSC 52 is a real terminal's copy route, and only that one. Over ssh from
# Ghostty, kitty, WezTerm or iTerm2, y in copy-mode carries the selection out.
# code-server's browser build drops the escape before it reaches the clipboard
# API (microsoft/vscode#318254), and no tmux option changes that: with
# set-clipboard on, a copy-mode y here filled tmux's buffer and produced zero
# clipboard calls. The option below stays for the ssh case.
#
# Prefix m is the fallback for a pane where Shift+drag will not cooperate: a
# released pointer makes an ordinary drag a browser selection.
#
#   to the laptop:    Shift+drag -- or Prefix m, drag, Prefix m to take the
#                     wheel back. Prefix-[ then k walks scrolled-back output
#                     onto the screen, where a drag can reach it.
#   from the laptop:  Ctrl+Shift+V or right-click. Both ask the browser's
#                     clipboard API, which the browser only exposes on a secure
#                     context: open the editor over the TLS public name, since
#                     on http://LAN-address the API is withheld and Ctrl+V is
#                     the one chord that still delivers. Ctrl+V is NOT a paste
#                     on a secure origin -- the pane gets the \x16 byte.
#                     Prefix-] pastes tmux's own buffer, bracketed.
bind-key m set -g mouse \; display-message -d 4000 'mouse #{?mouse,on,off} -- drag copies to the browser when off'

# Copy-mode copies leave through OSC 52 into the client terminal's system
# clipboard. allow-passthrough keeps that route open for an app inside the pane
# (vim's `+` register) instead of only for tmux's own copy-mode.
set -g set-clipboard on
set -g allow-passthrough on

# Color and key fidelity through the multiplexer. tmux rewrites 24-bit color
# down to the palette the attached client advertises, so a theme reads washed
# out in the browser even when the app inside emits truecolor; the RGB feature
# turns that rewrite off. extkeys is what lets Shift+Enter and Ctrl+. reach the
# pane distinct from Enter, and tmux's stock xterm* entry omits it. Together
# with set-clipboard and allow-passthrough above these cover the options
# `grok doctor` writes fixes for, and extkeys is the one Doctor leaves to the
# operator. A client reads terminal-features only at attach, so after a reseed:
# tmux source-file ~/.tmux.conf, then detach and reattach. tmux 3.5 and later
# also want `set -s extended-keys-format csi-u`; the image ships 3.4, which
# rejects that option.
set -g extended-keys on
set -as terminal-features ',*:RGB'
set -as terminal-features 'xterm*:extkeys'

# vi copy mode: v begins a selection, y copies and releases, Escape clears.
# Prefix-] pastes the buffer back with bracketed paste around it, which is the
# tmux-internal half of the flow: a copy made in the browser tab lands in this
# buffer, and Prefix-= lists the buffers when you want an older one.
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X clear-selection

# Release the pointer after a drag-select: copy and drop out of copy-mode
# instead of parking in it.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# One history per pane, deep enough that a reattached terminal still reaches the
# output a closed tab produced and a scroll-back still finds the start of a
# build. Measured on the shipped tmux 3.4 with one saturated pane: 50000 lines
# of 120-column output holds the server at 193 MB, 100000 at 381 MB, and the
# same 100000 lines of plain 80-column output costs 60 MB. tmux applies the
# number to panes created from now on, so an existing pane keeps the limit it
# was born with (tmux(1)); a new pane or a `tmux kill-server` is what takes a
# raise.
set -g history-limit 100000

# Every attached client is a full renderer: on this stack one browser tab
# equals one xterm.js on the other end of a WebSocket, re-parsing whatever
# tmux paints for that client. focus-events is what tells tmux which of them
# the human is looking at: without it tmux sees keystrokes only, so it has no
# focused client to size a window by and nothing to blame for a pane app that
# keeps animating. The sequence is forwarded to the pane too, so a TUI can idle
# on blur. tmux(1) wants clients detached and reattached after it changes.
#
# aggressive-resize is deliberately left at its default. Its own entry in
# options-table.c scopes it to `window-size smallest` and `manual`, and the
# default `latest` already sizes the current window from the client with the
# most recent activity -- resize.c consults aggressive-resize only as a filter
# over those clients -- so under `latest` it would change nothing here while
# tmux(1) warns it is "poor for interactive programs such as shells".
set -g focus-events on

# Key and focus latency. tmux holds back any Escape it reads for escape-time to
# see whether more of a sequence follows, and 3.4 ships that at 500 ms: Alt,
# the arrow keys and Esc itself feel like dropped input, and a focus-in can
# wait that long -- twice, with set-timing -- before tmux repaints. Upstream
# cut the default to 10 ms in 3.5 (CHANGES), and that is the number pinned
# here, not the 0 vim guides recommend: at 10 a keystroke is never held, while
# 0 splits an Esc from the character behind it whenever a throttled background
# tab delivers the two more than 10 ms apart, which loses every Alt chord
# (measured on this build: Esc, 300 ms, q fires M-q at 500 and not at 10).
# Server option, so `tmux source-file ~/.tmux.conf` moves it for live panes.
set -s escape-time 10
