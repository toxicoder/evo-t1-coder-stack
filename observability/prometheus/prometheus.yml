# Prometheus scrape and remote-write config for the EVO-T1 stack.
#
# Read this file's own two halves together: Prometheus is the *collection* tier
# (it is the only component that talks to the services being observed) and Mimir
# is the *storage* tier everything else queries. Keeping both here is deliberate:
# one file, so a new scrape target and its remote-write stay one edit.
#
# What is scraped is the set of services that actually expose a Prometheus
# endpoint. SearXNG, Kasm, Hermes, the Postgres db and the two nginx sidecars do
# not (see docs/observability.md), so they are absent here rather than present and
# permanently red: a dead target is a firing `up == 0` alert, which is not the
# same signal as "this service publishes no metrics".

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  # Stamped on every series that leaves for Mimir, so a dashboard that spans
  # several stacks can still tell this box's series from another's.
  external_labels:
    stack: evo-t1

# Long-term storage. Prometheus keeps its own 15d window (the retention flags on
# the service) so a Mimir outage costs nothing, and Mimir holds the long window;
# Grafana's `mimir` datasource is what reads it back.
remote_write:
  - url: http://mimir:8080/api/v1/push
    # Mimir's ingest path is per-tenant. `-auth.enabled: false` in
    # observability/mimir/mimir.yml is what makes the header unnecessary; if that
    # is ever switched back on, this needs an `X-Scope-OrgID` header again.
    queue_config:
      max_samples_per_send: 2000
      capacity: 10000
      # A stalled Mimir should cost latency, not the newest samples. Without a cap
      # on the retry backoff the send queue fills and what gets dropped is the
      # data an operator is most likely asking about.
      max_backoff: 1m

# Rules are loaded from the same read-only mount as this file, so a path here is
# relative to /etc/prometheus inside the container (docker-compose.yml binds
# ./observability/prometheus). Everything under rules/ arrives with this file;
# there is no second place to register a rule.
rule_files:
  - rules/stack.rules.yml
  - rules/spark.rules.yml
  - rules/inference.rules.yml

# The alerts fire here and are *delivered* by Alertmanager, which owns grouping,
# silences and the repeat interval. Not adding this block would leave every rule
# in rules/ visible on Prometheus's /alerts page and nowhere else - no silence,
# no grouping, and nothing for Grafana's Alerting page to read.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
      # Alertmanager is on the same profile as this service, so the pair comes up
      # together; the timeout keeps a restarting Alertmanager from stalling the
      # queue, which the notifier bounds by dropping when it fills. There is no
      # cap to set here: v3.16.0 has no such key, and promtool refuses the config.
      timeout: 10s

scrape_configs:
  # ---- the bundle itself ----------------------------------------------------
  # Each of these answers /metrics from its own binary; they are here because a
  # monitoring layer that does not monitor itself is how a silent gap becomes
  # normal. `job` becomes the `job` label, which the Grafana overview dashboard
  # groups on.
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: mimir
    static_configs:
      - targets: ["mimir:8080"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # ---- stack services that publish metrics ---------------------------------
  # Coder's metrics listener is already on for the stack: docker-compose.yml sets
    # CODER_PROMETHEUS_ENABLE and binds 0.0.0.0:2112 *inside* the container, and
  # publishes it to 127.0.0.1:2112 only. Both facts matter here: the compose
  # network reaches coder:2112 fine (the loopback prefix restricts the host-side
  # mapping, not the in-network listener), and nothing outside this network can.
  - job_name: coder
    static_configs:
      - targets: ["coder:2112"]

  # LiteLLM's /metrics comes from `callbacks: ["prometheus"]` in
  # litellm/config.yaml, and it sits behind LITELLM_MASTER_KEY like every other
  # LiteLLM route (SECURITY.md). The token arrives as a file, not as a variable.
  # Measured on v3.16.0: `$VAR` and `${VAR}` under `global.external_labels` come back
  # expanded at `/api/v1/status/config`, and `$(VAR)` stays literal even there, while
  # in a scrape config a target address and `authorization.credentials` keep the bytes
  # the operator wrote - all three forms reached a header-logging listener unchanged,
  # each of them sent out exactly as it was typed.
  # So a
  # `credentials:` here would scrape with a literal `$(LITELLM_MASTER_KEY)` and
  # LiteLLM would answer 401 `Unauthorized access to metrics endpoint: No
  # connected db.` forever. That wording is the tell, and it is not about a
  # database: at v1.102.1 the auth path compares the bearer against the master key
  # and returns PROXY_ADMIN before it ever looks for a DB, so only a *wrong* token
  # falls through to the "No connected db." branch. Keep the auth on and fix the
  # token; setting `litellm_settings.require_auth_for_metrics_endpoint: false`,
  # which is what that 401 offers, would put the model aliases and traffic counts
  # the metrics carry on the LAN, since :4000 is published to it.
  #
  # Compose writes the file (docker-compose.yml's `configs:` block) from the same
  # LITELLM_MASTER_KEY the proxy interpolates, mode 0444, at the path below. A
  # missing or wrong file is one red target and nothing else - Prometheus loads
  # the rest of this config and reports the failure as that target's lastError,
  # which is what `observability-check` reads.
  - job_name: litellm
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus-secrets/litellm_token
    static_configs:
      - targets: ["litellm:4000"]

  # ---- the stack host, as a machine -----------------------------------------
  # Everything above this line scrapes a *service*. These two scrape the box the
  # services run on, which is the half the bundle did not have: an operator could
  # see a container burning CPU and could not see whether the machine was out of
  # memory, out of disk, or thrashing. node_exporter runs with pid:host and
  # --collector.processes for exactly that reason (docker-compose.yml).
  # The job name is the service name, which is what rules/stack.rules.yml's
  # exporter-gap alerts select on (`job="node_exporter"`, `job="cadvisor"`); a
  # rename here has to be made there too or those two alerts go quiet forever.
  - job_name: node_exporter
    static_configs:
      - targets: ["node_exporter:9101"]
        labels:
          # One label distinguishes the stack host from the Sparks, which carry
          # the same series names from their own node_exporter. A dashboard that
          # means "this box" filters on it; a fleet query ignores it.
          evo_t1_host: stack-host

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          evo_t1_host: stack-host
    # Container identity here is the `name` label (the Docker container name);
    # `id` is a cgroup path and is useless to a reader. The two labels cadvisor
    # is started with a whitelist for are therefore load-bearing - see the
    # service's command in docker-compose.yml.

  # ---- the DGX Sparks ------------------------------------------------------
  # Targets for the Spark node_exporter and DCGM exporter come from the
  # gitignored sparks.json the host generates via //scripts:spark-monitor, so
  # no hostname is committed here, and an absent file is an unenrolled fleet.
  # The path is absolute because this file's own mount does not hold it:
  # compose binds that directory at /etc/spark-targets, a sibling mount.
  - job_name: spark-node
    file_sd_configs:
      - files:
          - /etc/spark-targets/sparks.json
        refresh_interval: 60s
    relabel_configs:
      # One file feeds four kinds of target, so each job keeps only its own. Without
      # this the two probe URLs in the same file would be scraped as metric
      # endpoints, and every enrolled box would carry two permanently failing targets.
      - source_labels: [exporter]
        regex: node_exporter|dcgm
        action: keep

  # Blackbox is the probe that answers the question an exporter cannot: is the
  # inference port answering at all, from outside the box. Prometheus passes the
  # real URL in `__param_target`, so one blackbox container probes every Spark and
  # the target label carries the URL rather than the prober's own address.
  #
  # The URLs come from the same generated file as the exporter targets, in groups
  # that carry a `job` label. No Spark address is committed here, and there is no
  # placeholder target to forget to edit: an unenrolled fleet simply has no groups,
  # which reads as zero Sparks rather than as a probe pointed at this box.
  - job_name: blackbox-spark
    metrics_path: /probe
    params:
      module: [spark_health]
    file_sd_configs:
      - files:
          - /etc/spark-targets/sparks.json
        refresh_interval: 60s
    relabel_configs:
      # Only the health group, and only from this file's four kinds of target.
      - source_labels: [exporter, probe]
        regex: blackbox;health
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # A second job over the same prober, for the model list. Two jobs rather than
  # one with a module matrix, because the two answers mean different things and an
  # operator alerts on them separately: a box can be healthy and still not be
  # serving the model its deployment says it is.
  - job_name: blackbox-spark-models
    metrics_path: /probe
    params:
      module: [spark_models]
    file_sd_configs:
      - files:
          - /etc/spark-targets/sparks.json
        refresh_interval: 60s
    relabel_configs:
      # Only the model-list group.
      - source_labels: [exporter, probe]
        regex: blackbox;models
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # The prober scraped as a service of its own. The two jobs above scrape what it
  # says about other machines; nothing there can tell you the prober died, because a
  # dead prober answers nothing at all and a target with no answer has no series to
  # alert on. This job is what makes `up{job="blackbox"}` exist.
  - job_name: blackbox
    static_configs:
      - targets: ["blackbox_exporter:9115"]
        labels:
          evo_t1_host: stack-host

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
