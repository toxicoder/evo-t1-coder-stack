# managed-by: evo-t1-coder-stack
#
# Seed config for the on-device Hermes assistant (hermes-agent v0.22.5). It is
# copied into the Hermes data volume as $HERMES_HOME/config.yaml, so edit it here
# and re-materialize the volume — never edit the copy the container reads.
#
# Shape follows the upstream config reference; keys not named here keep their
# upstream defaults on purpose (no mcp_servers block, no per-deployment caps —
# LiteLLM owns routing and this stack never adds rpm/tpm limits).
model:
  # OpenAI-compatible transport: the stack's LiteLLM proxy on the compose network.
  provider: custom
  # LiteLLM alias `agent` — the tool-capable Spark lane (real tool_calls array).
  # If every Spark box is down the alias falls back to `coder` inside LiteLLM,
  # whose tool calls come back as plain text and cannot drive the agent loop; the
  # Arc-side fallback is `chat` (qwen2.5:7b), which does emit tool_calls. Move to
  # it without touching this file: `hermes config set model.model chat`.
  model: agent
  base_url: http://litellm:4000/v1
  # Expanded from the environment (the Hermes container's env / its own .env), so
  # no secret byte lands in git. LITELLM_MASTER_KEY is the only credential this
  # assistant holds; there is no GitHub token here by design.
  api_key: ${LITELLM_MASTER_KEY}

# Optional local providers, reachable through the same LiteLLM door as the model
# above. These three name the models this stack runs on its own hardware: the
# Arc 140T's IPEX-LLM Ollama weights, behind the `coder` / `coder-fast` / `chat`
# aliases. A `providers:` entry is inert until something asks for it, so the
# default above stays `agent` and nothing about a healthy Spark box changes;
# reach one with `hermes --provider arc-chat`, or make it the default with
# `hermes config set model.provider arc-chat`. `default_model` travels with the
# entry, which is why there is one entry per alias rather than one shared
# endpoint: LiteLLM owns the choice of what that alias means.
#
# Why through LiteLLM and not at http://ollama:11434 directly: the proxy is the
# stack's sole model transport, it is where the aliases and the Arc's context
# window are defined, and 11434 is deliberately unpublished. The same door also
# means these entries carry the same key the default one does, expanded from the
# container's environment at load. No context_length is set here: 32768 is the
# Arc weights' window, litellm/config.yaml owns that number, and a second copy
# would be a second owner of it.
#
# The `spark-coder` / `spark-chat` aliases (Ollama on a Spark box) answer on this
# endpoint too; no entry is shipped for them because they are off-box, optional,
# and usually powered off. Add one with the same three keys when a box is there.
providers:
  # The one Arc model that can drive an agent loop: qwen2.5:7b returns a real
  # tool_calls array on this runtime (measured), so this is the local lane to
  # pick when every Spark box is down and a Chat tab session still needs tools.
  arc-chat:
    base_url: http://litellm:4000/v1
    api_key: ${LITELLM_MASTER_KEY}
    default_model: chat
  # The Qwen2.5-Coder weights, at two sizes. Chat and summarisation only: on this
  # runtime a request carrying `tools` answers with the call written into the
  # message body as plain text and finish_reason "stop", so an agent turn quietly
  # loses its tools. They stay listed because they are the strongest local
  # completions the box has, and a non-agent session wants them; they are simply
  # not an agent driver. litellm-routing.md names the measured limitation.
  arc-coder:
    base_url: http://litellm:4000/v1
    api_key: ${LITELLM_MASTER_KEY}
    default_model: coder
  arc-coder-fast:
    base_url: http://litellm:4000/v1
    api_key: ${LITELLM_MASTER_KEY}
    default_model: coder-fast

terminal:
  # `local`, not `docker`: the docker backend runs the command inside a fresh
  # container and skips the dangerous-command approvals this file depends on.
  backend: local
  # Identical-path checkout: compose bind-mounts STACK_HOST_PATH at the same
  # path inside the container (empty-var CI fallback is /opt/stack).
  #
  # scripts/hermes-bootstrap.sh substitutes this placeholder when it copies the
  # seed into the volume, so the file the gateway reads carries a literal path.
  # Hermes cannot do that itself: agent/runtime_cwd.py validates terminal.cwd
  # with expanduser() alone, so an unresolved "${STACK_HOST_PATH}" is logged as
  # `TERMINAL_CWD does not exist: ${STACK_HOST_PATH}` on every session and the
  # agent starts outside the checkout it is meant to operate. The config loader
  # does expand ${VAR} - which is why api_key below works, and why
  # `hermes config get terminal.cwd` reports a resolved path while the runtime
  # does not. Only the runtime path decides where commands run, and this key
  # owns it: apply_terminal_config_to_env copies it over TERMINAL_CWD, so the
  # compose variable is a backstop for a config that names no cwd here.
  cwd: ${STACK_HOST_PATH}
  timeout: 180

web:
  # The assistant reaches the public web through the stack's own SearXNG, and
  # nowhere else. Both keyless switches stay false on purpose: with no web
  # backend configured at all, agent/web_search_registry.py finishes its
  # resolution walk at the anonymous free-tier ring (exa, parallel, firecrawl,
  # keenable) and a "local-only" box quietly sends the query to a third party.
  # keyless_rescue is the second half of that: one retry on the same ring when
  # the chosen backend fails a call.
  #
  # Only the search capability is pinned. searxng is the one bundled provider
  # that needs no API key - it reads SEARXNG_URL, which docker-compose.yml
  # points at http://searxng:8181 on the compose network - and it is
  # search-only, so web.backend and web.extract_backend stay unset and
  # web_extract fails closed with "no extract provider configured" rather than
  # dialing a third-party extractor. An operator who wants page fetches sets
  # web.extract_backend deliberately; nothing here reaches one by default.
  search_backend: searxng
  keyless_fallback: false
  keyless_rescue: false

approvals:
  # manual: every flagged command waits for the operator. `smart` is not used for
  # v1 and `off` must never be set — the docker socket is mounted in this container.
  mode: manual
  timeout: 300
  cron_mode: deny
  unattended_mode: deny

skills:
  # The git-tracked skills tree, bind-mounted read-only beside the checkout.
  external_dirs:
    - /opt/stack-skills

dashboard:
  # The router sidecar is not loopback, so uvicorn only honours
  # X-Forwarded-Proto from listed peers. /0 is rejected upstream.
  # public_url is env HERMES_DASHBOARD_PUBLIC_URL, not this file (the
  # volume seed is copy-once).
  trusted_proxies: ["172.16.0.0/12"]
