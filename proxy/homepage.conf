# EVO-T1 Coder stack — TLS terminator for the Homepage dashboard.
#
# Homepage is a Next.js app that serves plain HTTP and has no certificate
# handling, so this nginx sidecar owns the default web ports: 80 redirects to
# HTTPS, 443 terminates TLS with the self-signed cert that scripts/bootstrap.sh
# generates, and everything proxies to the unpublished homepage container.
#
# Strict-Transport-Security is deliberately absent. The cert is self-signed and
# the browser-facing host is a LAN IP that bootstrap.sh re-issues into the cert
# whenever the address changes, so pinning HSTS would strand the dashboard on a
# certificate the host no longer serves.
#
# The redirect below assumes TLS on the standard port. If you move
# HOMEPAGE_HTTPS_PORT off 443, edit the return line to append the new port.
#
# Upstream: https://gethomepage.dev/installation/docker/

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/homepage.crt;
    ssl_certificate_key /etc/nginx/certs/homepage.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # A dashboard render fans out to every service through homepage's API proxy,
    # so hold the upstream long enough that a slow model or status call does not
    # surface as a 502.
    #
    # proxy_pass takes a variable on purpose: with a literal hostname nginx
    # resolves it once at config load and keeps the old container IP after
    # homepage is recreated, which surfaces as 502s. A variable forces nginx to
    # re-resolve through Docker's embedded DNS on every request. With a variable
    # upstream nginx stops appending the URI itself, hence $request_uri.
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $homepage_upstream http://homepage:3000;
        proxy_pass $homepage_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # NextAuth reads this to decide whether the session cookie is Secure and
        # to build the sign-in redirect.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
