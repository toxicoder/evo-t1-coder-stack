# EVO-T1 Coder stack — Host-based router for the four public hostnames.
#
# Traefik on the other box owns TLS for these names: it presents the real
# certificates and forwards plain HTTP to this box, so this nginx holds no
# certificate and listens only on the plain port compose publishes as
# ${STACK_PROXY_HTTP_PORT:-8080}:8080. Its whole job is picking a container from
# the Host header, which is why every block below names one hostname exactly and
# an unmatched Host gets refused rather than guessed at.
#
# LAN access is unchanged and still lives in proxy/homepage.conf, which serves
# the dashboard on 443 with the self-signed cert scripts/bootstrap.sh generates.
# Nothing here touches ports 80 or 443.
#
# Renaming a public hostname means editing it here AND in docker-compose.yml:
# homepage validates the Host header against HOMEPAGE_ALLOWED_HOSTS, and the
# links the dashboard renders come from HOMEPAGE_VAR_CODER_URL,
# HOMEPAGE_VAR_KASM_URL and HOMEPAGE_VAR_LITELLM_URL. A name changed on one side
# only gives either a 421 from homepage or cards that point at the old DNS name.
#
# $connection_upgrade needs its map in THIS file: homepage-proxy and router are
# separate containers, each mounting one conf.d file, so the map at the top of
# proxy/homepage.conf is not in this container's environment at all.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Coder template uploads are zip archives of a whole template directory, and
# Kasm accepts file transfers and profile images from inside a stream. The 1m
# nginx default would reject those with a 413 that reads like an application bug.
client_max_body_size 512m;

# TLS terminates at Traefik, so the request arrives over plain HTTP and nginx
# cannot infer the scheme: every block below sets X-Forwarded-Proto https by
# hand, because Coder and Homepage both build their redirect targets and the
# Secure flag on their session cookie from that header.
#
# Every proxy_pass below takes a variable on purpose, exactly as homepage.conf
# does: with a literal hostname nginx resolves it once at config load and keeps
# the old container IP after that container is recreated, which surfaces as 502s.
# A variable forces a re-resolve through Docker's embedded DNS on each request,
# and it also stops nginx appending the URI itself — hence $request_uri.

server {
    listen 8080;
    server_name gmktecbeast.overeazy.io;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $homepage_upstream http://homepage:3000;
        proxy_pass $homepage_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # Same Next.js app and the same fan-out to every service card as the LAN
        # listener, so the same timeout applies.
        proxy_read_timeout 60s;
    }
}

server {
    listen 8080;
    server_name coder.gmktecbeast.overeazy.io;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        # Coder's plain listener; CODER_TLS_ADDRESS on 3443 is what the published
        # LAN port maps to, and Traefik does not need a second TLS hop here.
        set $coder_upstream http://coder:3000;
        proxy_pass $coder_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # The workspace agent tunnel and the dashboard's long-poll both ride a
        # WebSocket that stays quiet between heartbeats and build events, so a
        # short read timeout would drop running workspaces.
        proxy_read_timeout 300s;
    }
}

server {
    listen 8080;
    server_name kasm.gmktecbeast.overeazy.io;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        # Kasm serves HTTPS on 4443 — that is the port its installer puts the UI
        # on (KASM_PORT), and 3000 is only the first-boot wizard.
        set $kasm_upstream https://kasm:4443;
        proxy_pass $kasm_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The desktop stream is a WebSocket over this connection, so the Upgrade
        # and Connection pair below is what makes a session open at all.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # The Kasm origin answers with the self-signed certificate its own
        # installer generates, and that certificate is reissued on every Kasm
        # reinstall, so verification is off rather than pinned to a cert that
        # stops matching the next time the container is rebuilt.
        proxy_ssl_verify off;
        # A streaming desktop session is a long-lived socket that looks idle
        # between input and frame packets.
        proxy_read_timeout 3600s;
    }
}

server {
    listen 8080;
    server_name litellm.gmktecbeast.overeazy.io;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $litellm_upstream http://litellm:4000;
        proxy_pass $litellm_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # LiteLLM authenticates from the Authorization header, and nginx forwards
        # client request headers to the upstream as-is, so no directive is needed
        # here and none below rewrites or clears it.
        #
        # Token streaming holds the response open and writes it out chunk by
        # chunk; response buffering would hold every token back until the model
        # finished generating.
        proxy_buffering off;
        # A long context can sit in prefill well past the default 60s before the
        # first byte arrives.
        proxy_read_timeout 600s;
    }
}

# Traefik routed this Host to the wrong vhost, or something is hitting the
# published port directly with an unrelated Host. 421 says the request was
# directed at a server that cannot produce a response for it, rather than
# quietly serving one container for a name that was never mapped.
server {
    listen 8080 default_server;
    server_name _;
    return 421;
}
