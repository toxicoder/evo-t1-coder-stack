# ## mypy — the Python type gate for this repository
#
# Checked by `bazelisk test //lints:mypy` (runner: lints/run_mypy.sh), which is a
# member of //lints:all and therefore of //:lint and //:test-all. The mypy binary
# is pinned by images/dev/tool-versions.env (MYPY_VERSION) and baked into the
# golden dev image, so the gate needs no network and no pip install.
#
# The profile is `--strict` plus the two options that carry this repo's strong-types
# rule: `disallow_any_explicit` (no `Any` written into a signature; a broad type is
# a design smell here) and `disallow_any_generics` (a bare `list` is not a type,
# `list[str]` is). The rest of this file keeps those two affordable: it narrows the
# places where the standard library hands back `Any` through an unstubbed
# dependency, rather than relaxing the rule everywhere.
#
# Keep the file list in lints/run_mypy.sh and the data edge in lints/BUILD.bazel in
# step with any new first-party Python package added below.

[mypy]
python_version = 3.12

# ── The strict profile, written out so each rule is nameable in review ──────────
warn_unused_configs = True
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True

# ── The two rules this repo adds on top of --strict ────────────────────────────
# An explicit `Any` is the broad type these annotations exist to remove. Where a
# value genuinely arrives unstructured (parsed TOML/JSON/YAML) name a recursive
# alias for it — see the JsonValue and TomlValue aliases in scripts/lib — instead
# of widening the signature.
disallow_any_explicit = True

# ── Error reporting ────────────────────────────────────────────────────────────
show_error_codes = True
show_column_numbers = True
pretty = False
namespace_packages = True
explicit_package_bases = True

# PyYAML ships no type information, so every name it exports is `Any` at the
# boundary. `ignore_missing_imports` keeps the import legal; the callers in
# scripts/lib/parse_yaml.py treat the parsed document as an untyped document
# rather than pretending the library is typed.
[mypy-yaml.*]
ignore_missing_imports = True
