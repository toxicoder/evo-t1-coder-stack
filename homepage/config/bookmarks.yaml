          href: https://docs.litellm.ai/
    - IPEX-LLM:
        - abbr: IPX
          href: https://ipex-llm.readthedocs.io/en/latest/doc/overview/get_started.html
    - Grok Build:
        - abbr: GRK
          href: https://docs.x.ai/build/overview

- Repo:
    - This stack:
        - abbr: STK
          href: https://github.com/toxicoder/evo-t1-coder-stack
    - Coder templates:
        - abbr: TPL
          href: https://github.com/coder/terraform-provider-coder
