---
# Service cards for the EVO-T1 Coder stack dashboard.
# Options and examples: https://gethomepage.dev/configs/services/
#
# Two URL spaces, and mixing them up is the classic homepage mistake:
#   href:  what the BROWSER opens, so it must be a LAN-reachable address —
#          these come from {{HOMEPAGE_VAR_*}} tokens that docker-compose.yml
#          fills in from .env (compose-internal names like http://coder:3000
#          resolve only inside the container, never in a browser).
#   url:   what the HOMEPAGE container fetches server-side, so it uses compose
#          DNS instead, which stays correct whatever the LAN IP is.
#
# Docker integration is deliberately off: the socket is a root-equivalent host
# credential. A container badge was never the status source anyway — the
# siteMonitor probe is, and settings.yaml renders it as UP/DOWN through
# statusStyle: basic. Host CPU, memory and disk come from the resources widget
# in widgets.yaml.
#
# Each customapi widget fills the stat band under the card title with at most
# four mappings (the shipped v2.4.0 bundle slices the list to four), so a card
# gets its breadth from several single-field widgets over separate endpoints.
# `format: size` reduces an array field to its length.
#
# Icons come from a public CDN, so cards lose their icon (not their function)
# when the box is offline.

- Coder:
    - Coder:
        icon: si-coder
        href: "{{HOMEPAGE_VAR_CODER_URL}}"
        # The one place an operator creates a workspace: the href opens Coder,
        # where Templates -> "workspace" (the plain dev container) or
        # "devcontainer" (DinD-backed) picks the shape, and the Git repository
        # field names the clone the editor opens on. README "Coder workspace
        # template" is the long version.
        description: Create a workspace here (Templates, then the workspace or devcontainer
          template), then use its agents, editor and Grok Build terminal on the clone
        siteMonitor: http://coder:3000/api/v2/buildinfo
        widget:
          type: customapi
          url: http://coder:3000/api/v2/buildinfo
          refreshInterval: 300000
          # One response, three scalars: the agent and provisioner API versions
          # are what a stale workspace agent or template shows up against.
          mappings:
            - field: version
              label: Version
            - field: agent_api_version
              label: Agent API
            - field: provisioner_api_version
              label: Prov API

- Models:
    - LiteLLM:
        icon: mdi-lightning-bolt
        href: "{{HOMEPAGE_VAR_LITELLM_URL}}"
        description: OpenAI-compatible front door for every model alias
        siteMonitor: http://litellm:4000/health/readiness
        widgets:
          - type: customapi
            url: http://litellm:4000/health/readiness
            refreshInterval: 60000
            mappings:
              - field: status
                label: Status
                remap:
                  - value: healthy
                    to: OK
                  - any: true
                    to: Problem
              # No Postgres in this compose file, so the honest cell says "No DB"
              # rather than rendering the raw "Not connected" as a failure.
              - field: db
                label: Database
                remap:
                  - value: "Not connected"
                    to: "No DB"
                  - value: "Connected"
                    to: "DB OK"
                  - any: true
                    to: "?"
          - type: customapi
            url: http://litellm:4000/models
            refreshInterval: 300000
            headers:
              Authorization: "Bearer {{HOMEPAGE_VAR_LITELLM_MASTER_KEY}}"
            mappings:
              - field: data
                label: Aliases
                format: size
    # Ollama has no href on purpose: 11434 is deliberately unpublished (see
    # SECURITY.md), so a link here would point at a closed port. The card still
    # gets live status over the compose network.
    - Ollama:
        icon: mdi-chip
        description: Qwen Coder on the Arc 140T — compose network only
        siteMonitor: http://ollama:11434/api/version
        # Three endpoints, one field each: /api/version, /api/tags and /api/ps
        # answer separately, and a single widget cannot merge their bodies.
        widgets:
          - type: customapi
            url: http://ollama:11434/api/version
            refreshInterval: 300000
            mappings:
              - field: version
                label: Version
          - type: customapi
            url: http://ollama:11434/api/tags
            refreshInterval: 300000
            mappings:
              - field: models
                label: Models
                format: size
          - type: customapi
            url: http://ollama:11434/api/ps
            refreshInterval: 300000
            mappings:
              - field: models
                label: Loaded
                format: size

    # The tool-capable backend Grok Build / Cline / Roo use by default. The Arc
    # Qwen2.5-Coder weights answer a tool request with plain text and
    # finish_reason "stop", which no agent driver can consume, so a reachable
    # Spark keeps the default alias on a path with real tool_calls. vLLM/SGLang
    # return a proper tool_calls array, making this the honest signal for
    # "will agent mode work right now". Hosts come from .env via
    # HOMEPAGE_VAR_*, because they change with the LAN.
    - Agent backend:
        icon: mdi-robot
        href: "{{HOMEPAGE_VAR_AGENT_URL}}"
        description: Agent lane — one TensorFold box per Spark; all three down = text-only Arc
        siteMonitor: "{{HOMEPAGE_VAR_AGENT_HEALTH}}"
        # The lane is ONE model group whose three deployments are one TensorFold
        # instance per Spark box (five full 262144-token streams each). One
        # workspace's traffic pins to one healthy box while that pin stays warm
        # (session_affinity, 1 h idle window); fresh or session-id-less traffic
        # spreads across the healthy boxes by least-busy (in-flight load). With
        # all three boxes down, `agent` degrades to `coder` (Arc, text-only) —
        # the per-box widgets below then error while the `agent` alias still
        # answers, which is the visible signal of that hop.
        # A box answering {ok:false, requests_running:0} is UP but not serving
        # the model — that is the state bazelisk run //scripts:spark-verify --
        # --no-tests exists to diagnose, not a sign of health.
        widgets:
          - type: customapi
            url: "{{HOMEPAGE_VAR_AGENT_HEALTH}}"
            refreshInterval: 300000
            # /v1/models is {"object":"list","data":[...]}. The array maps only as
            # `format: size`, which reduces it to a count; the raw array would not
            # render as a label/value pair.
            # `any: true` only has meaning INSIDE a remap list — the customapi
            # component reads mapping.remap, and a flat `- any:/to:` mapping has no
            # field, so getValue returns the whole response body and React throws
            # error #31 rendering the object (caught on the live page).
            # An unreachable endpoint needs no mapping at all: useWidgetAPI reports
            # an error and Container renders the built-in error state.
            mappings:
              - field: object
                label: API
                remap:
                  - value: list
                    to: OK
                  - any: true
                    to: "?"
              - field: data
                label: Models
                format: size
          # One widget per Spark box, fed by {{HOMEPAGE_VAR_SPARKn_HEALTH}}:
          # requests_running counts the streams that box is servicing right now
          # (its scheduler queues above five). All three moving is fresh or
          # unpinned traffic spreading by least-busy. One box pinned high with
          # idle peers is either one workspace's pinned streams or, if that
          # box was meant to shed load, the sticky choice that keeps that
          # workspace's prompt-prefix cache warm on one engine — a tuning
          # signal, not automatically a fault.
          - type: customapi
            url: "{{HOMEPAGE_VAR_SPARK1_HEALTH}}"
            refreshInterval: 60000
            mappings:
              - field: requests_running
                label: spark-1 busy
              - field: ok
                label: spark-1
                remap:
                  - value: true
                    to: "up"
                  - any: true
                    to: "down"
          - type: customapi
            url: "{{HOMEPAGE_VAR_SPARK2_HEALTH}}"
            refreshInterval: 60000
            mappings:
              - field: requests_running
                label: spark-2 busy
              - field: ok
                label: spark-2
                remap:
                  - value: true
                    to: "up"
                  - any: true
                    to: "down"
          - type: customapi
            url: "{{HOMEPAGE_VAR_SPARK3_HEALTH}}"
            refreshInterval: 60000
            mappings:
              - field: requests_running
                label: spark-3 busy
              - field: ok
                label: spark-3
                remap:
                  - value: true
                    to: "up"
                  - any: true
                    to: "down"

- Desktops:
    # No widget here: Kasm exposes no unauthenticated JSON endpoint (/health and
    # /api/health both 404), so a widget would only render an error block.
    - Kasm:
        icon: mdi-desktop-classic
        href: "{{HOMEPAGE_VAR_KASM_URL}}"
        description: Streamed desktops on :4443 (the :3000 wizard is first boot only)
        siteMonitor: https://kasm:4443/

- Host:
    # siteMonitor only: /api/status answers unauthenticated (it reports that
    # auth is required) so the card can go UP/DOWN without a dashboard cookie.
    # No customapi widget — the JSON shape is not a contract we pin, and a
    # mapping error would render an error block under the title.
    - Hermes:
        icon: mdi-console
        href: "{{HOMEPAGE_VAR_HERMES_URL}}"
        description: On-device host assistant - Chat tab is the interactive
          terminal with approval prompts (public name when configured, otherwise LAN)
        siteMonitor: http://hermes:9119/api/status

    # The stack's own meta-search: the lane the workspace agents and Hermes dial
    # (SEARXNG_URL, default http://host.docker.internal:8181). It was the one
    # published service with no card, so an operator could not see the search
    # path was down until an agent reported an empty answer.
    #
    # /healthz answers 200 with a two-byte body and queries no upstream engine,
    # which is what makes it the right badge target. The widget reads /config for
    # the same reason: both are served from the instance's own state, so the
    # dashboard never asks Google what it thinks about anything. Probing the
    # engine pool for real rows is //scripts:search-check's job precisely because
    # it should happen on demand: a polled /search?format=json would park
    # engines on the rate-limit and CAPTCHA walls suspended_engines.awk reports.
    - SearXNG:
        icon: mdi-magnify
        href: "{{HOMEPAGE_VAR_SEARCH_URL}}"
        description: Self-hosted meta-search - the web lane agents and Hermes use
        siteMonitor: http://searxng:8181/healthz
        widgets:
          - type: customapi
            url: http://searxng:8181/config
            # Hourly: /config carries the whole engine catalog, and the three
            # fields below change only when searxng/settings.yml changes.
            refreshInterval: 3600000
            mappings:
              - field: version
                label: Version
              # The two security-relevant switches searxng/settings.yml names.
              # Limiter is safe to leave off only while Public stays off, so
              # they read as a pair; remap runs before format, hence booleans.
              - field: limiter
                label: Limiter
                remap:
                  - value: false
                    to: "off"
                  - any: true
                    to: "ON"
              - field: public_instance
                label: Public
                remap:
                  - value: false
                    to: "off"
                  - any: true
                    to: "ON"

- Observability:
    # The whole bundle is one flag (OBSERVABILITY_ENABLED, see README "Observability"):
    # off, compose brings up none of these containers, and all five cards read `down`
    # together on a stack that was never asked to run them. That is the honest signal,
    # not a card bug - the badge reports what the endpoint answers, and the flag is the
    # reason it does not answer.
    #
    # Still no docker socket (see the header comment): the badge is each service's own
    # health endpoint, which proves the wiring rather than the container record. That
    # matters more here than anywhere else on this page - the Loki, Tempo, Mimir and
    # Alloy images are distroless (no shell, no wget), so they carry no in-container
    # healthcheck and this probe is the only liveness read the stack has for them.
    #
    # Loki, Tempo and Mimir ship no UI of their own, so their href opens the Grafana
    # view that queries them while the badge still probes each service directly. The
    # hrefs are tokens because Prometheus and Grafana are the two published ports; the
    # other three are compose-network only and are reachable to nobody but the dashboard.
    - Grafana:
        icon: si-grafana
        href: "{{HOMEPAGE_VAR_GRAFANA_URL}}"
        description: One pane for the stack - metrics, logs and traces on provisioned datasources
        siteMonitor: http://grafana:3000/api/health
        widget:
          type: customapi
          url: http://grafana:3000/api/health
          refreshInterval: 300000
          # /api/health is the one Grafana endpoint that needs no session or API key,
          # and it answers {"database":"ok","version":"<tag>"}. The version is what an
          # operator checks against the image pin in docker-compose.yml after a pull,
          # and `database` is the failure Grafana reports there rather than in its log.
          mappings:
            - field: database
              label: Storage
              remap:
                - value: ok
                  to: OK
                - any: true
                  to: Problem
            - field: version
              label: Version

    - Prometheus:
        icon: si-prometheus
        href: "{{HOMEPAGE_VAR_PROMETHEUS_URL}}"
        description: Scrapes every stack service and remote_writes to Mimir - loopback :9090 only
        # /-/healthy is Prometheus' own readiness path (200 once the TSDB is open);
        # it is not /metrics, so the probe never pulls a scrape body into the dashboard.
        siteMonitor: http://prometheus:9090/-/healthy

    # No href: 3100 is unpublished (SECURITY.md keeps the stores off the LAN), and the
    # only UI that speaks to Loki is Grafana's Explore. {{HOMEPAGE_VAR_GRAFANA_URL}} is
    # the browser-reachable half of that pair.
    - Loki:
        icon: mdi-file-search-outline
        href: "{{HOMEPAGE_VAR_GRAFANA_URL}}/explore"
        description: Log store - opens Grafana Explore, Loki serves no UI of its own
        siteMonitor: http://loki:3100/ready

    - Tempo:
        icon: mdi-call-split
        href: "{{HOMEPAGE_VAR_GRAFANA_URL}}/explore"
        description: Trace store - opens Grafana Explore, Tempo serves no UI of its own
        siteMonitor: http://tempo:3200/ready

    - Mimir:
        icon: mdi-database
        href: "{{HOMEPAGE_VAR_GRAFANA_URL}}"
        description: Long-term metrics behind Prometheus remote_write - opens Grafana
        siteMonitor: http://mimir:8080/ready
