---
# Service cards for the EVO-T1 Coder stack dashboard.
# Options and examples: https://gethomepage.dev/configs/services/
#
# Two URL spaces, and mixing them up is the classic homepage mistake:
#   href:  what the BROWSER opens, so it must be a LAN-reachable address —
#          these come from {{HOMEPAGE_VAR_*}} tokens that docker-compose.yml
#          fills in from .env (compose-internal names like http://coder:3000
#          resolve only inside the container, never in a browser).
#   url:   what the HOMEPAGE container fetches server-side, so it uses compose
#          DNS instead, which stays correct whatever the LAN IP is.
#
# Docker integration is deliberately off: the socket is a root-equivalent host
# credential. A container badge was never the status source anyway — the
# siteMonitor probe is, and settings.yaml renders it as UP/DOWN through
# statusStyle: basic. Host CPU, memory and disk come from the resources widget
# in widgets.yaml.
#
# Each customapi widget fills the stat band under the card title with at most
# four mappings (the shipped v2.4.0 bundle slices the list to four), so a card
# gets its breadth from several single-field widgets over separate endpoints.
# `format: size` reduces an array field to its length.
#
# Icons come from a public CDN, so cards lose their icon (not their function)
# when the box is offline.

- Coder:
    - Coder:
        icon: si-coder
        href: "{{HOMEPAGE_VAR_CODER_URL}}"
        description: Workspaces, agents and the Grok Build terminal
        siteMonitor: http://coder:3000/api/v2/buildinfo
        widget:
          type: customapi
          url: http://coder:3000/api/v2/buildinfo
          refreshInterval: 300000
          # One response, three scalars: the agent and provisioner API versions
          # are what a stale workspace agent or template shows up against.
          mappings:
            - field: version
              label: Version
            - field: agent_api_version
              label: Agent API
            - field: provisioner_api_version
              label: Prov API

- Models:
    - LiteLLM:
        icon: mdi-lightning-bolt
        href: "{{HOMEPAGE_VAR_LITELLM_URL}}"
        description: OpenAI-compatible front door for every model alias
        siteMonitor: http://litellm:4000/health/readiness
        widgets:
          - type: customapi
            url: http://litellm:4000/health/readiness
            refreshInterval: 60000
            mappings:
              - field: status
                label: Status
                remap:
                  - value: healthy
                    to: OK
                  - any: true
                    to: Problem
              # No Postgres in this compose file, so the honest cell says "No DB"
              # rather than rendering the raw "Not connected" as a failure.
              - field: db
                label: Database
                remap:
                  - value: "Not connected"
                    to: "No DB"
                  - value: "Connected"
                    to: "DB OK"
                  - any: true
                    to: "?"
          - type: customapi
            url: http://litellm:4000/models
            refreshInterval: 300000
            headers:
              Authorization: "Bearer {{HOMEPAGE_VAR_LITELLM_MASTER_KEY}}"
            mappings:
              - field: data
                label: Aliases
                format: size
    # Ollama has no href on purpose: 11434 is deliberately unpublished (see
    # SECURITY.md), so a link here would point at a closed port. The card still
    # gets live status over the compose network.
    - Ollama:
        icon: mdi-chip
        description: Qwen Coder on the Arc 140T — compose network only
        siteMonitor: http://ollama:11434/api/version
        # Three endpoints, one field each: /api/version, /api/tags and /api/ps
        # answer separately, and a single widget cannot merge their bodies.
        widgets:
          - type: customapi
            url: http://ollama:11434/api/version
            refreshInterval: 300000
            mappings:
              - field: version
                label: Version
          - type: customapi
            url: http://ollama:11434/api/tags
            refreshInterval: 300000
            mappings:
              - field: models
                label: Models
                format: size
          - type: customapi
            url: http://ollama:11434/api/ps
            refreshInterval: 300000
            mappings:
              - field: models
                label: Loaded
                format: size

    # The tool-capable backend Grok Build / Cline / Roo use by default. The Arc
    # Qwen2.5-Coder weights answer a tool request with plain text and
    # finish_reason "stop", which no agent driver can consume, so a reachable
    # Spark keeps the default alias on a path with real tool_calls. vLLM/SGLang
    # return a proper tool_calls array, making this the honest signal for
    # "will agent mode work right now". Hosts come from .env via
    # HOMEPAGE_VAR_*, because they change with the LAN.
    - Agent backend:
        icon: mdi-robot
        href: "{{HOMEPAGE_VAR_AGENT_URL}}"
        description: Agent lane — one TensorFold box per Spark; all three down = text-only Arc
        siteMonitor: "{{HOMEPAGE_VAR_AGENT_HEALTH}}"
        # The lane is ONE model group whose three deployments are one TensorFold
        # instance per Spark box (five full 262144-token streams each), spread by
        # least-busy. With all three boxes down, `agent` degrades to `coder`
        # (Arc, text-only) — the per-box widgets below then error while the
        # `agent` alias still answers, which is the visible signal of that hop.
        # A box answering {ok:false, requests_running:0} is UP but not serving
        # the model — that is a "run scripts/spark-verify.sh" state, not health.
        widgets:
          - type: customapi
            url: "{{HOMEPAGE_VAR_AGENT_HEALTH}}"
            refreshInterval: 300000
            # /v1/models is {"object":"list","data":[...]}. The array maps only as
            # `format: size`, which reduces it to a count; the raw array would not
            # render as a label/value pair.
            # `any: true` only has meaning INSIDE a remap list — the customapi
            # component reads mapping.remap, and a flat `- any:/to:` mapping has no
            # field, so getValue returns the whole response body and React throws
            # error #31 rendering the object (caught on the live page).
            # An unreachable endpoint needs no mapping at all: useWidgetAPI reports
            # an error and Container renders the built-in error state.
            mappings:
              - field: object
                label: API
                remap:
                  - value: list
                    to: OK
                  - any: true
                    to: "?"
              - field: data
                label: Models
                format: size
          # One widget per Spark box, fed by {{HOMEPAGE_VAR_SPARKn_HEALTH}}:
          # requests_running counts the streams that box is servicing right now
          # (its scheduler queues above five). All three moving during a fan-out
          # is what least-busy spreading looks like; one box pinned high while
          # its peers idle is the self-inflicted queue this layout avoids.
          - type: customapi
            url: "{{HOMEPAGE_VAR_SPARK1_HEALTH}}"
            refreshInterval: 60000
            mappings:
              - field: requests_running
                label: spark-1 busy
              - field: ok
                label: spark-1
                remap:
                  - value: true
                    to: "up"
                  - any: true
                    to: "down"
          - type: customapi
            url: "{{HOMEPAGE_VAR_SPARK2_HEALTH}}"
            refreshInterval: 60000
            mappings:
              - field: requests_running
                label: spark-2 busy
              - field: ok
                label: spark-2
                remap:
                  - value: true
                    to: "up"
                  - any: true
                    to: "down"
          - type: customapi
            url: "{{HOMEPAGE_VAR_SPARK3_HEALTH}}"
            refreshInterval: 60000
            mappings:
              - field: requests_running
                label: spark-3 busy
              - field: ok
                label: spark-3
                remap:
                  - value: true
                    to: "up"
                  - any: true
                    to: "down"

- Desktops:
    # No widget here: Kasm exposes no unauthenticated JSON endpoint (/health and
    # /api/health both 404), so a widget would only render an error block.
    - Kasm:
        icon: mdi-desktop-classic
        href: "{{HOMEPAGE_VAR_KASM_URL}}"
        description: Streamed desktops on :4443 (the :3000 wizard is first boot only)
        siteMonitor: https://kasm:4443/
