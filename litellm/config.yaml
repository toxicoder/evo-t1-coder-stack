# LiteLLM proxy config for the EVO-T1 stack.
#
# Workspaces and desktops always talk to one OpenAI-compatible base URL
# (http://host.docker.internal:4000/v1) and pick a model alias. Aliases are
# the stable names: "coder" / "coder-fast" / "chat" for the Arc Ollama path,
# "agent" for the tool-capable Spark lane (ONE model group whose
# three deployments are one TensorFold-served inference backend per Spark box),
# and "agent-low" / "agent-medium" / "agent-xhigh" for the same lane with a
# thinking level baked in. `agent` itself already thinks at xhigh. The fifth
# Spark alias, "agent-swarm", is the same lane with the session pin dropped for
# that group alone, so a parallel fan-out is placed across every reachable box
# instead of sharing the five streams of the one box its workspace is pinned to.
# Routing inside that group is session-scoped and best-effort: one conversation
# — or one workspace sharing one affinity key — rides the same healthy box
# while that pin stays warm, and a fresh conversation or a request with no
# session id fans out across every reachable box by least-busy. With none
# reachable `agent` falls back to `coder`.
# The sixth and seventh Spark aliases, "agent-explore" and "agent-review", are
# that same pin lift for the two one-shot roles a parent fleet dispatches: the
# read-only child that digs for evidence bakes low, the child that checks what
# landed bakes xhigh. Neither is a conversation and neither carries a warm
# prefix into a next turn, so neither wants the pin.
#
# The eighth and ninth, "agent-xhigh-fast" and "agent-swarm-fast", are the two
# lanes a session picks when it wants its conversation summary answered cheaply.
# Each is byte-for-byte the deployment shape of the lane it is named after; the
# only difference is that litellm/compaction_router.py re-targets the Grok CLI's
# summary call to the Arc Ollama group "compaction-fast" before the router picks a
# box. The CLI has no compaction-model key, so the hop lives here rather than in
# the client, and it is armed by the alias alone: a session on any other lane
# compacts exactly as it always has.
#
# Local models run on the IPEX-LLM Ollama container (Arc 140T, compose
# network only). The optional NVIDIA Spark boxes run no Ollama of their own.
# The agent alias targets the TensorFold /v1 endpoints those boxes run on
# :8888 (SPARKn_OPENAI_URL, an OpenAI-compatible /v1 endpoint).
#
# One endpoint per box, one box per endpoint. Never point two deployments (or
# two aliases) at the same physical box: the proxy counts deployments, not
# machines — least-busy keeps its in-flight counters per deployment and a
# session pin names one deployment — so two URLs on one box look like spread
# while the conversation stays on a machine that already has work.
#
# Schema note: each entry must be `model_name:` plus a nested `litellm_params:`
# block. LiteLLM hard-indexes both keys at startup (KeyError -> uvicorn exit 3
# -> restart loop), and flat `model:`/`api_base:`/`api_key:` at the entry level
# are accepted as extras and then silently ignored.
model_list:
  # Arc-backed - IPEX-LLM Ollama on the Arc 140T (compose network only).
  # MEASURED LIMITATION for the two Qwen2.5-Coder weights (this runtime is
  # ipex-llm's bundled ollama 0.9.3): a request with `tools` returns the call as
  # plain text with finish_reason "stop" and no tool_calls field, on both
  # /api/chat and /v1/chat/completions, so agent mode cannot drive them. qwen2.5:7b
  # on the same runtime does return a real tool_calls array — the limit is the
  # model, not the runtime.
  - model_name: coder
    litellm_params:
      model: ollama_chat/qwen2.5-coder:32b
      api_base: http://ollama:11434
      api_key: local-arc
    model_info:
      # Qwen2.5-Coder caps at 32k context.
      max_input_tokens: 32768
      # Not probed. A group's only deployment cannot be pulled out of rotation by
      # the health filter anyway, so a mark here buys no routing and costs a
      # cooldown on the terminal fallback. See the failover block under
      # general_settings.
      disable_background_health_check: true
  - model_name: coder-fast
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://ollama:11434
      api_key: local-arc
    model_info:
      max_input_tokens: 32768
      # Not probed; see `coder` above and the failover block under general_settings.
      disable_background_health_check: true
  - model_name: chat
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: http://ollama:11434
      api_key: local-arc
    model_info:
      max_input_tokens: 32768
      # Not probed; see `coder` above and the failover block under general_settings.
      disable_background_health_check: true

  # Spark-backed agent lane - TensorFold (vLLM-lineage, OpenAI-compatible /v1)
  # serving Qwen3.8-Flash-Next on :8888. THREE deployments in ONE `agent` group,
  # all equal (no `order:` tier): session_affinity pins a session id to one
  # box for as long as that pin stays warm, and least-busy still chooses among
  # the healthy boxes for everything else — a fresh conversation, traffic that
  # carries no session id, and a pinned conversation whose box went unhealthy
  # or into cooldown (that request routes elsewhere, the pin is kept, and the
  # conversation goes back to the box once it is healthy again). Spreading
  # across every reachable box is still the point of running three boxes (5 full
  # 262144-token streams each) — pinning only narrows the candidates first.
  # An `order:` tier would make the tier-2 boxes unreachable while any tier-1
  # box is healthy.
  # Provider prefix is openai/ deliberately: ollama_chat/ would route these
  # through the Ollama-specific code path. api_base must include /v1.
  # `model:` is sent to the backend verbatim and must match the served id
  # byte-for-byte — "Qwen3.8-Flash-Next" with that exact case and hyphens,
  # measured against the live boxes and equal to the recipe's SERVED_NAME
  # default. A wrong id does not crash the proxy: v1.102.1 builds the Router
  # with ignore_invalid_deployments forced to True (not settable from
  # config.yaml), so a bad model id drops that deployment at boot with one
  # log line and later surfaces as "No deployments available", not an error.
  # /health shows every deployment — trust it, not the absence of boot errors.
  # api_key below resolves from SPARKn_API_KEY and MUST be non-empty: v1.102.1
  # fails every request inside the proxy ("The api_key client option must be
  # set...") when it is empty, before the request ever reaches the box. The
  # shipped default is the placeholder `local-spark` — not a secret, ignored
  # by a keyless vLLM/TensorFold backend; replace per box via .env only if
  # that box was started with --api-key.
  # No rpm/tpm/max_parallel_requests caps anywhere on purpose. The proxy's cap
  # chain (rpm -> max_parallel_requests) parks requests behind an in-memory
  # semaphore when a cap is set; with no caps a fully-offered box sheds load
  # in its own scheduler instead of queueing inside the proxy. Session pinning
  # gives part of that spreading back on purpose: one workspace's agent loop can
  # sit on a busy box, and that is the trade — stickiness buys prefix-cache
  # locality and one predictable box for the whole conversation.
  - model_name: agent
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK1_OPENAI_URL
      api_key: os.environ/SPARK_1_API_KEY
      # Baked, not requested: Coder Agents picks `agent` and gets the hard
      # thinking level with it. A `reasoning_effort` in the request still wins.
      reasoning_effort: xhigh
    model_info:
      # v1.102.1 has no `deploy_name` key. Health checks, cooldowns and the
      # least-busy in-flight counters all attribute per deployment via
      # model_info.id, so each box gets a unique id — that is what keeps a
      # cooled box visibly OUT of healthy_deployments instead of blending into
      # the group's aggregate stats.
      id: agent-spark-1
      # Declared so capability lookups and /v1/model/info report tool calling
      # for a model id that is absent from LiteLLM's cost/capability map.
      supports_function_calling: true
      supports_tool_choice: true
      # Inert for routing while enable_pre_call_checks stays off (its
      # default); records the true window for /model_group/info readers.
      max_input_tokens: 262144
  - model_name: agent
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK2_OPENAI_URL
      api_key: os.environ/SPARK_2_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-spark-2
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK3_OPENAI_URL
      api_key: os.environ/SPARK_3_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-spark-3
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144

  # Thinking lanes - the same three boxes, three MORE independent model groups.
  # Qwen3.8-Flash-Next takes low / medium / xhigh and nothing else (there is no
  # `high`), so the thinking level is a name a client picks rather than a knob it
  # turns: `agent` is the default and already bakes xhigh, and these three make
  # the level selectable by alias, from the Coder Agents model dropdown. Each is
  # its own group of three Spark deployments with that level baked into
  # litellm_params, so an entry is still `model_name:` plus a nested
  # `litellm_params:` block like every other entry here.
  #
  # These groups deliberately reuse the SPARKn_OPENAI_URL / SPARK_n_API_KEY pairs
  # that `agent` uses — Coder Agents picking a level must not need more hardware.
  # That is not the "two deployments on one box" mistake warned about above: that
  # warning is about one group counting two URLs on one machine as two boxes.
  # Routing state is per group, so groups are independent — least-busy's counters
  # and the session pin are computed inside a model group, and two chats on
  # different aliases can land on the same box at the same time. What does not
  # change is the box: 5 full 262144-token streams in total, whichever aliases
  # arrive on it, shedding its own overflow in its own scheduler. Still no
  # rpm/tpm/max_parallel_requests on these entries either.
  - model_name: agent-low
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK1_OPENAI_URL
      api_key: os.environ/SPARK_1_API_KEY
      reasoning_effort: low
    model_info:
      # Unique id per deployment, same reason as `agent` above: health checks,
      # cooldowns and the least-busy counters attribute per deployment.
      id: agent-low-spark-1
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-low
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK2_OPENAI_URL
      api_key: os.environ/SPARK_2_API_KEY
      reasoning_effort: low
    model_info:
      id: agent-low-spark-2
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-low
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK3_OPENAI_URL
      api_key: os.environ/SPARK_3_API_KEY
      reasoning_effort: low
    model_info:
      id: agent-low-spark-3
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144

  - model_name: agent-medium
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK1_OPENAI_URL
      api_key: os.environ/SPARK_1_API_KEY
      reasoning_effort: medium
    model_info:
      id: agent-medium-spark-1
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-medium
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK2_OPENAI_URL
      api_key: os.environ/SPARK_2_API_KEY
      reasoning_effort: medium
    model_info:
      id: agent-medium-spark-2
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-medium
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK3_OPENAI_URL
      api_key: os.environ/SPARK_3_API_KEY
      reasoning_effort: medium
    model_info:
      id: agent-medium-spark-3
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144

  - model_name: agent-xhigh
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK1_OPENAI_URL
      api_key: os.environ/SPARK_1_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-xhigh-spark-1
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-xhigh
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK2_OPENAI_URL
      api_key: os.environ/SPARK_2_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-xhigh-spark-2
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-xhigh
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK3_OPENAI_URL
      api_key: os.environ/SPARK_3_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-xhigh-spark-3
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144

  # Swarm lane - the same three boxes, ONE MORE independent model group, with the
  # session pin lifted for this group alone. Nothing about what a request costs a
  # box changes; what changes is which box a request lands on.
  #
  # Why the four groups above need their pin and why a fan-out does not: the pin
  # makes a conversation stay on one box, which is what a conversation wants (its
  # prefix cache stays warm and every turn of it is prefilled once). The cost
  # shows up under parallelism. Every call of a workspace, the parent loop and
  # each of its subagents alike, carries that workspace's one x-litellm-session-id,
  # so a whole fan-out resolves to the SAME deployment and shares that one box's
  # admission slots - PARALLEL, 5 full-length streams by default, set in
  # scripts/spark-configure.sh. A fan-out of six then waits on five slots while the
  # other two boxes sit reachable and under-offered.
  #
  # `agent-swarm` asks the fleet instead of the box. model_group_affinity_config
  # (router_settings, below) gives this group an empty flag list, which at v1.102.1
  # REPLACES the global affinity flags for this group only, so no pin resolves and
  # each request goes to the global least-busy picker and lands on the healthy
  # deployment with the fewest requests in flight. One workspace's fan-out ceiling
  # goes from PARALLEL streams on one box to PARALLEL on each reachable box - 15
  # across three - with no cap added in the proxy to get there.
  #
  # The trade stated plainly: an agent-swarm CONVERSATION is not sticky, so its
  # next turn may be prefilled on a different box and pay prefill again. That is
  # the right trade for independent parallel work (subagents, batch edits, one-shot
  # jobs, anything whose turns do not share a long warm prefix) and the wrong one
  # for a single long thread, which is what `agent` and its three thinking aliases
  # remain there for.
  #
  # Reusing the SPARKn_OPENAI_URL / SPARK_n_API_KEY pairs is the same deliberate
  # reuse the thinking aliases document above: routing state is per group, so
  # least-busy's in-flight counters are computed inside this group and a fifth
  # group costs no extra hardware. What still holds inside this group is one
  # deployment per box - three boxes, three deployments, three unique ids. And
  # still no rpm/tpm/max_parallel_requests anywhere: a saturated box sheds load in
  # its own scheduler, and relocation on a refusal lives on the box (patch 0029).
  - model_name: agent-swarm
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK1_OPENAI_URL
      api_key: os.environ/SPARK_1_API_KEY
      # Baked to match `agent`, so the swarm lane is a drop-in for it and a
      # subagent that cannot send a thinking level still gets xhigh.
      reasoning_effort: xhigh
    model_info:
      # Unique per deployment for the same reason as every group above: health
      # checks, cooldowns and the least-busy counters attribute per deployment.
      id: agent-swarm-spark-1
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-swarm
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK2_OPENAI_URL
      api_key: os.environ/SPARK_2_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-swarm-spark-2
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-swarm
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK3_OPENAI_URL
      api_key: os.environ/SPARK_3_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-swarm-spark-3
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144

  # Fan-out lanes - the same three boxes, TWO MORE independent model groups, each
  # with the session pin lifted the way agent-swarm lifted it above. Nothing about
  # what a request costs a box changes; what changes is which box lands on.
  #
  # Why these two need the lift and the four lanes above keep the pin: both serve a
  # child that answers once. An explore child digs for evidence and returns a
  # digest; a review child reads what landed and returns findings. Neither carries
  # a long warm prefix into a next turn, so the prefix-cache warmth the pin
  # protects is worth nothing here - and the parent loop that dispatches them puts
  # every one of those calls under the SAME x-litellm-session-id, which is exactly
  # the shape agent-swarm exists for. A fan-out of six pinned children waits on one
  # box's admission slots while the other two boxes sit reachable and under-offered:
  # those slots are PARALLEL, 5 full-length streams by default, set in
  # scripts/spark-configure.sh. Lift the pin and the same fan-out costs PARALLEL on
  # each reachable box - 15 across three - with no cap added in the proxy to get
  # there.
  #
  # The baked level is the only thing that separates the two lanes: an explore child
  # is a lookup, so it takes low and answers fast; a review child is the check that
  # a landed claim is actually true, so it takes the level `agent` itself carries.
  # model_group_affinity_config (router_settings, below) names both with an empty
  # flag list, and each declares its own six-key model_group_retry_policy block
  # because a group inherits nothing from its siblings. Reusing the
  # SPARKn_OPENAI_URL / SPARK_n_API_KEY pairs is the same deliberate reuse the
  # groups above document - routing state is per group, so a sixth and seventh group
  # cost no extra hardware - and inside a group it stays one deployment per box:
  # three boxes, three deployments, three unique ids. Still no
  # rpm/tpm/max_parallel_requests anywhere: a saturated box sheds load in its own
  # scheduler, and relocation on a refusal lives on the box (patch 0029).
  - model_name: agent-explore
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK1_OPENAI_URL
      api_key: os.environ/SPARK_1_API_KEY
      reasoning_effort: low
    model_info:
      # Unique per deployment for the same reason as every group above: health
      # checks, cooldowns and the least-busy counters attribute per deployment.
      id: agent-explore-spark-1
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-explore
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK2_OPENAI_URL
      api_key: os.environ/SPARK_2_API_KEY
      reasoning_effort: low
    model_info:
      id: agent-explore-spark-2
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-explore
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK3_OPENAI_URL
      api_key: os.environ/SPARK_3_API_KEY
      reasoning_effort: low
    model_info:
      id: agent-explore-spark-3
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144

  # The reviewer's lane: same three boxes, same pin lift as agent-explore above,
  # and the level `agent` bakes, because a child that has to catch a wrong claim is
  # the one place extra thinking pays for itself. The tool-calling flags are real
  # here for the same reason they are real for `agent`: the reviewer opens the
  # files it is judging rather than trusting the diff it was handed.
  - model_name: agent-review
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK1_OPENAI_URL
      api_key: os.environ/SPARK_1_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-review-spark-1
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-review
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK2_OPENAI_URL
      api_key: os.environ/SPARK_2_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-review-spark-2
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-review
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK3_OPENAI_URL
      api_key: os.environ/SPARK_3_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-review-spark-3
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144

  # Fast-compaction lanes - the two lanes a Grok Build session picks when it wants its
  # conversation summary served somewhere cheaper. Everything about them is the lane they
  # are named after: `agent-xhigh-fast` is `agent-xhigh` (three equal Spark deployments,
  # xhigh baked, the session pin kept) and `agent-swarm-fast` is `agent-swarm` (the same
  # three boxes with the pin lifted). Not one deployment differs from its parent, because
  # the turn is still meant to run on a Spark at extra-high thinking.
  #
  # What differs is what happens to ONE call of the conversation. The Grok Build CLI has no
  # compaction-model key: the summary it asks for when a session nears its context window
  # rides the session model and inherits that model's thinking level, so a summary of a
  # 200k-token session is answered by Qwen3.8-Flash-Next at xhigh - measured at 107 s to
  # 1915 s, and thinking is most of it. A summary needs no thinking. These two lanes ask
  # litellm/compaction_router.py to move that one call to `compaction-fast` below, before
  # the router picks a deployment; every other call of the same conversation stays here.
  #
  # The hop is a property of the alias, not of the proxy: a session on `agent`, `agent-xhigh`
  # or `agent-swarm` compacts exactly as it always has. That is the opt-in, and
  # EVO_T1_FAST_COMPACTION=0 is the kill switch beside it.
  - model_name: agent-xhigh-fast
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK1_OPENAI_URL
      api_key: os.environ/SPARK_1_API_KEY
      reasoning_effort: xhigh
    model_info:
      # Unique per deployment for the same reason as every group above: health checks,
      # cooldowns and the least-busy counters attribute per deployment.
      id: agent-xhigh-fast-spark-1
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-xhigh-fast
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK2_OPENAI_URL
      api_key: os.environ/SPARK_2_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-xhigh-fast-spark-2
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-xhigh-fast
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK3_OPENAI_URL
      api_key: os.environ/SPARK_3_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-xhigh-fast-spark-3
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144

  - model_name: agent-swarm-fast
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK1_OPENAI_URL
      api_key: os.environ/SPARK_1_API_KEY
      # Baked to match `agent-swarm`, so the two swarm aliases are interchangeable for a
      # fan-out and only the compaction hop separates them.
      reasoning_effort: xhigh
    model_info:
      id: agent-swarm-fast-spark-1
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-swarm-fast
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK2_OPENAI_URL
      api_key: os.environ/SPARK_2_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-swarm-fast-spark-2
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-swarm-fast
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK3_OPENAI_URL
      api_key: os.environ/SPARK_3_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-swarm-fast-spark-3
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144

  # The compaction target - the Arc's Ollama, reached the same way `coder-fast` is. One
  # deployment because the Arc is one box, so no pin and no least-busy decision to make.
  #
  # Deliberately NOT `coder-fast` itself: giving the hop its own group keeps a session that
  # picked the Arc coding weight as its model from sharing routing state with a summary call
  # it never asked for, and it gives this group its own fallback below.
  #
  # No `reasoning_effort` line: a thinking level on a summarizer is the exact cost this lane
  # exists to stop paying, and the Qwen2.5 weights on this runtime are not thinking models.
  # No tool-calling flags either - the router strips `tools` and `tool_choice` from the call
  # it moves, because the measured behaviour of these weights on this runtime is to answer a
  # `tools` request as plain text anyway, and a summary wants the plain text.
  #
  # 32768 is the honest window of these weights, and it is why the router refuses to move a
  # summary it estimates above EVO_T1_FAST_COMPACTION_INPUT_LIMIT: Ollama would clamp the
  # input to its own context rather than fail, and a silently truncated summary is worse than
  # the slow one it replaced. Raising the window is a per-request `num_ctx` away, and it is
  # left alone because a window past what the weights were trained on degrades the answer
  # without an error to notice.
  - model_name: compaction-fast
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://ollama:11434
      api_key: local-arc
    model_info:
      id: compaction-fast-arc
      max_input_tokens: 32768
      # Not probed; see `coder` above and the failover block under general_settings.
      # This one matters most: a summary the router refuses to move has nowhere
      # else to go, so a probe-driven cooldown here is a hard failure.
      disable_background_health_check: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # No DB-backed key management, virtual keys, or Admin UI on this box.
  store_model_in_db: false
  # --- Failover: what takes a dead Spark box out of rotation, and what brings
  # it back. Read this before changing anything in this block. Two mechanisms
  # exclude a deployment, they do different jobs, and only one of them can see
  # the failure this fleet actually gets.
  #
  # Cooldown (router_settings) is blind to a box that is simply gone.
  # _is_cooldown_required returns False the moment the exception text contains
  # "APIConnectionError" (router_utils/cooldown_handlers.py:223, ignored_strings).
  # A closed port, a dead engine process, and a TensorFold box that refuses with
  # the status-less NoRoom value all surface as APIConnectionError, so no
  # allowed_fails number cools them. Cooldown still earns its place below: it is
  # what removes a box that answers HTTP and returns real 5xx.
  #
  # This filter is the mechanism that removes a refused connection. With
  # enable_health_check_routing on, deployment selection drops every deployment
  # the last probe cycle marked unhealthy: async_get_available_deployment
  # (router.py:13041) -> async_get_healthy_deployments (router.py:12700) ->
  # _async_filter_health_check_unhealthy_deployments (router.py:14137). It sees
  # what cooldown cannot. Both writes happen in the same sweep, and the order is
  # the point: the health state goes in at proxy_server.py:3981, above the
  # routing-only bail at :3988 and above the cooldown loop at :3991, so a mark
  # exists before the cooldown path gets a chance to veto the same exception. The
  # write is not unconditional -- it sits behind the guard at :3965, which is the
  # same flag this block turns on -- but nothing between the write and the veto
  # can undo it. It is also why least-busy needed an input at all:
  # a box that refuses everything sits at an in-flight count of zero, because the
  # counter is raised before the call (router_strategy/least_busy.py:120) and
  # given back on the failure hooks (:132, :146), and _least_busy (:83) picks the
  # FIRST deployment at the minimum (:88) -- so an unfiltered least-busy prefers a
  # dead box over a healthy one.
  #
  # Recovery needs no operator and no proxy restart: the next green probe
  # overwrites the mark with is_healthy (health_check.py:683), and the same
  # loop is what notices, so a box that comes back on its own is eligible again
  # inside one cycle.
  #
  # Three settings turn this filter off again, each verified in the pinned image:
  # enable_health_check_routing off (the no-op at router.py:14153);
  # health_check_interval unset or <= 0, which returns from the probe loop before
  # it starts (proxy_server.py:4071) and so starves the cache the filter reads;
  # or a router-wide allowed_fails_policy with background_health_check_model_groups
  # unset, which hands exclusion back to cooldown outright (router.py:14161).
  # The filter fails open -- it returns the whole candidate list when the state is
  # missing, older than health_check_staleness_threshold, or when filtering would
  # leave no candidate at all -- so the worst this can do is route as if it were
  # off, never strand the fleet. One fail-open is worth naming because it recurs:
  # this proxy has no Redis, so the marks live in one process's cache
  # (router_utils/health_state_cache.py:32-36, one key at :50), and every restart or
  # redeploy clears them until the first sweep completes. The async filter logs
  # nothing when it fails open, so nothing in the log says it just did nothing.
  #
  # What the filter shares with cooldown, and what it does not. The sweep that
  # marks a deployment unhealthy also cools it: the same cycle calls
  # _set_cooldown_deployments with time_to_cooldown=cooldown_time for every
  # endpoint it marked (:4013, :4018), and that path is gated on this flag being
  # on (:3988), so turning the filter on is also what makes the probe loop a
  # cooldown writer that needs no traffic to arm. The two lists then differ in
  # one way that matters here: the health filter fails open (above), the cooldown
  # filter does not. Its only rescue, router.py:12774, requires
  # allowed_fails_policy to be set -- and this file deliberately keeps that unset
  # (see router_settings), so a candidate list emptied by cooldown raises
  # no-deployment-available rather than falling back.
  #
  # That asymmetry is why the four Arc deployments carry
  # model_info.disable_background_health_check. Each is the only member of its
  # group, so the health filter can never use a mark against it: dropping the
  # single candidate is exactly the "would leave no candidate" case that makes it
  # fail open. The mark would therefore buy no routing and cost the cooldown
  # above, which has no such fail-open -- and `coder` is the terminal target of
  # every agent lane's fallback chain, so a cooled `coder` means the request fails
  # outright instead of degrading. One non-retryable status is enough to arm it:
  # _is_cooldown_required admits 401/404/408 (cooldown_handlers.py:234-248) and
  # the arm at :400 checks only whether LiteLLM would retry that status, with no
  # single-deployment guard, so a non-retryable status from a probe -- a 401, or a
  # 404 that reaches the router with its int status intact -- can park the fallback
  # for a full cooldown_time with no user request having failed (_should_retry
  # returns True for 408/409/429/5xx and False for the rest, utils.py:6854-6880, so
  # only that second family arms the check at :400). The arm did not reproduce in the
  # three-box harness: an Ollama 404 came back through the probe as
  # exception_status 500, which is retryable and therefore lands on the guarded arms
  # instead. So read this opt-out as what the source says it prevents -- and as four
  # fewer real completions every cycle, since 4 of the 31 probes were buying nothing.
  #
  # Scope, stated honestly: the filter sits on the chat-completion selection path
  # above. The image / audio / embedding / rerank paths select through
  # _async_get_healthy_deployments (router.py:8554), which applies cooldown and
  # the blocked flag only. This fleet serves chat and streaming completions.
  #
  # health_check_interval and health_check_concurrency MUST sit here: under
  # router_settings the proxy raises ValueError at boot. The two routing keys
  # below are read from here too: proxy_server.py:6014 picks them out of this
  # block and :6048-6058 hands them to the Router constructor, which is where an
  # operator checking "is my key honoured" wants to be looking.
  background_health_checks: true
  enable_health_check_routing: true
  # A probe is not a free HEAD: at this tag the proxy sends the deployment's whole litellm_params
  # through ahealth_check into acompletion, so a baked reasoning_effort rides along, and
  # it asks for health_check_max_tokens (default 16). A thinking reply cannot finish its
  # reasoning in 16 tokens, so the probe comes back finish=length with empty content and
  # the server logs a max_tokens warning for it, and the probe still takes a prompt-cache
  # state on a box whose cache sits at 100 percent ("0 MiB spare of 6465 MiB"), evicting a
  # warm conversation prefix that then re-prefills from zero. One log window held 60 such
  # probe replies against real traffic, and the four probes queued behind a long turn were
  # dropped after roughly 81 s of waiting. The per-probe cap behind that is 60 s
  # (HEALTH_CHECK_TIMEOUT_SECONDS, constants.py:1557, read per deployment at
  # health_check.py:530), so the extra twenty seconds is queueing ahead of the cap;
  # that split is inference, the 81 s is the measurement. That measured cost is the
  # floor under this number: the filter only works while the probes run, so this is the
  # dial that trades a dead box's exposure against a warm prompt cache.
  #
  # 120 s, from the 300 s that was only LiteLLM's own default. Now that the filter is on,
  # that default is the worst case a hard-down box stays pickable, and it is longer than
  # any other link in the chain: a request that finds the box dead is retried twice and
  # then hops to `coder` in seconds, so the exposure users feel is detection latency.
  # Read the period as one sweep plus this number, not as this number: the loop sleeps
  # health_check_interval AFTER a sweep finishes (proxy_server.py:4234), and a sweep is
  # the 27 deployments that did not opt out above, through the concurrency-2 gate
  # below. It is also why nothing here goes lower: at 30 s the probe queue itself
  # becomes the traffic, which is a cost, not a verdict. A merely busy box is not
  # punished for a slow probe -- health_check_ignore_transient_errors below drops the
  # 408 a stalled probe raises before it can mark (:3971) or cool (:4002) anything, and
  # that key is what keeps a busy box in rotation, so it is load-bearing now and the
  # suite pins it.
  health_check_interval: 120
  # How long a mark stays believable. The default is computed from a constant, not from
  # the interval above -- DEFAULT_HEALTH_CHECK_INTERVAL * 2 = 600 s whatever this block
  # says (router.py:993) -- so it has to be set alongside a lowered interval rather than
  # assumed to follow it. 900 s sits above one worst-case sweep plus the interval, so a
  # mark outlives the cycle that wrote it (a box stays out while it is still failing),
  # while a deployment that drops out of the probe list altogether is believed dead for
  # at most 15 minutes before the filter fails open and routes to it again.
  health_check_staleness_threshold: 900
  health_check_concurrency: 2
  # Load-bearing, not cosmetic, now that the marks drive routing. A probe
  # that stalls behind a long turn comes back as a 408, and this is what drops it
  # before it can mark a busy-but-alive box unhealthy (:3971) or cool it (:4002).
  # Turning it off would let one slow 16-token probe move a session-pinned
  # conversation off its warm box and force a re-prefill for a cycle.
  health_check_ignore_transient_errors: true
  # Inert while no request limiter is configured; guardrail if one ever
  # returns: a saturated-and-capped deployment will not collect cross-deployment
  # retries meant for relocation.
  disable_retry_on_max_parallel_request_limit_error: true

litellm_settings:
  drop_params: true
  # Provider-SDK retries and router cross-deployment retries are different
  # things: retrying a saturated box eight times on the SAME deployment buys no
  # relocation and burns tens of minutes. Two retries cover a transient blip;
  # moving off a busy box is routing's job, not the retry chain's.
  num_retries: 2
  # One chain-wide deadline, 1200 s. Long compaction summaries and generations
  # on a saturated Spark outrun a 10-minute read timeout: the Grok CLI's own
  # streaming idle allowance is 1200 s (per model + [models] default in the
  # Grok templates), and a shorter proxy timeout here would cut those calls
  # off with a proxy-side error before the client ever gives up. With both
  # ends at 1200, one slow call may take a full 20 minutes before either end
  # calls it dead.
  request_timeout: 1200
  # Exposes /metrics. Prometheus support is not gated on a premium licence.
  # The second entry is the fast-compaction hop: a CustomLogger subclass in
  # litellm/compaction_router.py, bind-mounted beside this file at /app by
  # docker-compose.yml (the proxy resolves a callback's dotted name against the directory
  # of the config file, so the module has to be a sibling of config.yaml). LiteLLM
  # dispatches async_pre_call_hook only to a callback that IS a CustomLogger and overrides
  # the method in its own class dict, so the dotted path names the instance: at the pinned
  # v1.102.1 an entry that resolves to a class is a ValueError at config load, from
  # litellm/proxy/common_utils/callback_utils.py, naming proxy_handler_instance back at you.
  callbacks: ["prometheus", "compaction_router.proxy_handler_instance"]

# Fallbacks live in router_settings, which takes precedence over the
# litellm_settings equivalent. `agent` degrades to `coder` (Arc, text-only —
# see the measured limitation above) when NO Spark box is healthy; that hop is
# a last resort and shows up in spend logs / per-deployment health instead of
# silently. The old chain `agent -> agent-fast -> coder` existed only because
# agent-fast was a second alias for the SAME model on a second box with a lower
# output ceiling; with one group of three equal deployments, least-busy covers
# that case and the chain collapsed to a single acyclic hop: agent -> coder.
# The three thinking aliases carry the same hop: they go down with exactly the
# same boxes as `agent`, so each degrades to `coder` on its own rather than
# inheriting a hop it does not have.
# (If a concurrency cap is ever reintroduced, its fallback pairing is
# `fallbacks` + `context_window_fallbacks` — both, not one.)
router_settings:
  # Verified in v1.102.1: least-busy picks the healthy deployment with the
  # fewest in-flight requests (per-deployment request counters, 3600 s TTL;
  # health checks, cooldowns and those counters all attribute per deployment,
  # which is why each box carries a unique model_info.id above). It decides
  # only for unpinned traffic: the affinity pin below resolves first, and
  # least-busy runs when nothing is pinned, when the pinned deployment is
  # unhealthy or in cooldown, and for any request with no session id.
  #
  # "Healthy" is an input this strategy does not have of its own, which is the
  # one thing to know before trusting it to spread load. Its counters are raised
  # before the call (router_strategy/least_busy.py:120) and given back on the
  # failure hook (:129 and :143), so a box that refuses every request sits at
  # zero and _least_busy (:83) returns the FIRST deployment at the minimum: a
  # dead box listed first in a group is the preferred target, not the avoided
  # one. Exclusion comes from the filters that run ahead of the strategy inside
  # async_get_healthy_deployments (router.py:12700) -- the health filter and the
  # cooldown filter. That is what enable_health_check_routing in
  # general_settings buys: routing to the least busy host is only correct once
  # the list it picks from is a live one.
  # No routing_strategy_args: its only meaningful child (`ttl`) belongs to the
  # latency-based strategies and least-busy's counter TTL is hardcoded (3600 s).
  # health_check_interval / health_check_concurrency live in general_settings
  # only — under router_settings the proxy raises ValueError at boot.
  routing_strategy: least-busy
  # ON, best-effort: this arms the router's DeploymentAffinityCheck, which pins
  # a session id to one deployment for as long as the pin is warm, so a pinned
  # conversation rides the same box and everything else keeps spreading. The
  # pin idles out after 3600 s without a request and every request refreshes
  # it, so it bounds idle time between requests, not conversation length.
  # Session id sources, in order: `x-litellm-trace-id`, then
  # `x-litellm-session-id`, then any `x-<vendor>-session-id`, then
  # `session-id`/`session_id`/`thread-id`/`conversation_id` (Codex style), then
  # W3C traceparent/baggage, plus body `metadata.session_id`; a value must look
  # like an id (alphanumerics, hyphens, underscores, 8+ chars) to count.
  # Who carries one here: the Grok CLI forwards extra_headers verbatim and the
  # workspace templates render `x-litellm-session-id = "ws-<workspace-uuid>"`
  # under [models] in ~/.grok/config.toml, so one key covers every
  # conversation of a workspace (in shared grok_profile_mode the single shared
  # profile file is re-rendered by the last-booted workspace, which then shares
  # that key across that user's workspaces). Cline/Roo carry none — the
  # extension settings have no custom-header field — and neither does the Coder
  # control-plane chat agent (2.36.6 aibridge forwards no per-conversation and
  # no custom session header); both are spread by least-busy, as intended.
  optional_pre_call_checks: ["session_affinity"]
  # Per-group affinity. Real at this tag: it is a Router.__init__ argument and is
  # not in ROUTER_SETTINGS_MANAGED_OUTSIDE_CONFIG, so config.yaml reaches it, and
  # setting it also self-arms the affinity callback. The valid flag names are
  # deployment_affinity, responses_api_deployment_check, session_affinity and
  # encrypted_content_affinity; an entry here REPLACES the global flag list for the
  # group it names instead of adding to it. So the four `[]` entries below mean
  # "no affinity check of any kind for these groups": no session pin resolves, and
  # every request is placed by the least-busy picker above. Every group absent from
  # this map keeps falling back to the global ["session_affinity"], which is why the
  # five lanes a conversation rides - agent, agent-low, agent-medium, agent-xhigh and
  # agent-xhigh-fast - stay pinned exactly as they were. This is the one place the pin
  # is lifted, and the lift follows what a lane is for rather than who calls it: the
  # fan-out lanes lift it because a wave has to spread, and agent-swarm-fast lifts it
  # although a person selects it, because selecting that alias is asking for a wave.
  #
  # This key is the opt-out; a client header is not. An empty or short
  # x-litellm-session-id does NOT skip the pin at this tag - that header and
  # x-litellm-trace-id are read verbatim at any length, and only the generic
  # x-<vendor>-session-id family is shape-checked - so a caller that tried to
  # spread by sending an empty value would collapse every swarm request onto one
  # shared pin, the opposite of the intent.
  model_group_affinity_config:
    agent-swarm: []
    agent-explore: []
    agent-review: []
    # The fast twin of the swarm lane asks for the same lift its parent asks for: a fan-out
    # on this alias is placed by least-busy across every reachable box. `agent-xhigh-fast`
    # is absent from this map on purpose - it is the pinned conversation lane, so it keeps
    # falling back to the global ["session_affinity"] exactly like agent-xhigh does.
    agent-swarm-fast: []
  # No allowed_fails key, and its absence is load-bearing in two directions.
  # Setting one moves exclusion onto the counting branch
  # (should_cooldown_based_on_allowed_fails_policy, reached from
  # router_utils/cooldown_handlers.py:405, and chosen whenever
  # _is_allowed_fails_set_on_router says the value is non-default, :612), whose
  # fail window is cooldown_time. So the `allowed_fails: 40` this replaced needed
  # 41 failures inside 5 seconds to cool anything, and it could never fire on the
  # one exception a down box raises anyway (the APIConnectionError veto,
  # cooldown_handlers.py:223). With the key absent the router keeps the vendor's
  # rate rule instead, the base-case arms at cooldown_handlers.py:392-398: a
  # deployment is cooled once it fails more than
  # DEFAULT_FAILURE_THRESHOLD_PERCENT (0.5, constants.py:69) of at least
  # DEFAULT_FAILURE_THRESHOLD_MINIMUM_REQUESTS (5, constants.py:131) requests in a
  # rolling minute -- the shape a TensorFold box returning real 5xx has under a
  # workspace whose session pin concentrates its traffic on that one box. It also
  # keeps Router.allowed_fails_policy None, which is what keeps the health filter
  # in general_settings switched on (router.py:14161).
  #
  # One caveat on the guard at :395, because it reads the wrong way at first: the
  # single-deployment exemption is keyed on the group the CALLER asked for
  # (:343-348, and routing_group_has_alternatives returns False for a group that
  # names nothing, router.py:1548), not on the deployment being judged. A request
  # that started as `agent` and fell through to a lone deployment therefore gets no
  # exemption from that arm, and two of the four arms (:389 and :400) carry no such
  # guard at all. That is the exposure the Arc opt-out above removes.
  #
  # What the rate rule cannot see is a lane with under five requests in a minute,
  # so a rarely-used alias stays pickable while it fails everything. The probe
  # loop covers that case, and it is why cooldown is worth tuning at all now.
  cooldown_time: 60
  # 60 s, from the 5 s that was LiteLLM's own default
  # (DEFAULT_COOLDOWN_TIME_SECONDS, constants.py:75). A cooldown is a real
  # exclusion on two paths now, and both are worth a minute: live 5xx traffic
  # under the rate rule above, and the probe loop, which cools every deployment
  # its last cycle marked unhealthy for exactly this many seconds
  # (proxy_server.py:4013, time_to_cooldown=router.cooldown_time, :4018). At 5 s
  # the entry expired before the next request arrived, so a cooled box was offered
  # again immediately; 60 s carries a request past its own retry chain and the
  # next few turns. It is also what sets the floor on coming back: each failing
  # cycle re-arms the entry, so a revived box is pickable only once the last one
  # expires, which can land after the green probe that cleared its mark. The box is
  # eligible first and busy later, and that gap is accepted rather than tuned away.
  # The same minute applies to every traffic-driven cooldown, including a Spark box
  # that failed three of five requests in a busy minute -- 12x the old 5 s, and long
  # enough to move a session pin that was warm on that box.
  # TensorFold on the Spark boxes answers an over-admitted stream with the Zig
  # error value NoRoom as an HTTP 500 body, and the SDK hands it to LiteLLM with
  # no int status_code. At v1.102.1 that puts it on the status-less branch of
  # exception_mapping_utils, so the router sees APIConnectionError -- and
  # RetryPolicy has no APIConnectionErrorRetries field to catch it. DefaultRetries
  # is the only field that can reach this error, which is why it is set here; do
  # not "clean it up" into a status-coded field.
  #
  # Scoped to the nine Spark lanes, so coder (Arc) and chat keep the plain
  # num_retries path. The nine groups are independent: none inherits agent's
  # entry, so each needs its own six keys. The four unpinned lanes need their own
  # for the same reason the five pinned ones do - their NoRoom refusals arrive
  # status-less too, and an unpinned group relocates better than a pinned one only
  # because the retry lands on whichever box is now least busy, not on a box the pin
  # keeps naming.
  #
  # The zeros pin the exceptions DefaultRetries would otherwise reach, and
  # NotFoundError is one of them: at this tag it has no field of its own, so a
  # typo'd model id would otherwise cost extra attempts before the same error.
  #
  # What this does NOT do: because the exception carries no status_code,
  # _deployment_ids_to_skip_on_retry excludes nothing and
  # _time_to_sleep_before_retry returns 0 while any deployment is healthy, so
  # these retries are instant and, under the workspace-wide session pin, land on
  # the same saturated box. This makes the refusal less likely to surface; the
  # relocation lives on the box (patch 0029 with TF_FLASHNEXT_ADMIT_RECLAIM=1,
  # asserted by //scripts:spark-configure) and in keeping in-flight fan-out at or
  # under a box's PARALLEL, since every subagent of a workspace shares one
  # x-litellm-session-id.
  #
  # ServiceUnavailableErrorRetries is 0, not 2, and it is the field that decides
  # whether a hung stream is re-dispatched. At this tag a stream that dies
  # before its first chunk raises MidStreamFallbackError, which subclasses
  # ServiceUnavailableError (exceptions.py:1114), and
  # get_num_retries_from_retry_policy walks the exception MRO most-specific
  # first, so that class lands on THIS field and never reaches DefaultRetries
  # (types/router.py:96-111, router_utils/get_retry_from_policy.py). NoRoom does
  # not: it arrives as APIConnectionError, which is absent from
  # _RETRIES_BY_EXCEPTION_TYPE, so the walk falls through to DefaultRetries.
  # Zeroing this field therefore stops the hung-stream re-dispatch while the
  # NoRoom contract above stays at two attempts.
  #
  # Why the re-dispatch is worth zeroing: a request that produced no chunk is
  # not a transient blip, and neither the CLI nor this proxy abandons it. The
  # Grok CLI's 300 s compaction wall-clock budget is evaluated only after the
  # response returns (a 500-token-per-second summary of a 200k-token history
  # streams for ~1090 s and still succeeded), and inference_idle_timeout_secs
  # does not fire on the compaction path at all -- signals.json reports
  # inferenceIdleTimeouts at 0 or 1 across the failing sessions and no hung
  # call was ever cut off at the then-current 1200 s idle deadline (the TOML
  # twins ship 1800 s today, and it is still off this path), and a held-open
  # upstream kept the client waiting past 3000 s. The only bound on a hang was
  # therefore this proxy's
  # request_timeout, multiplied by every attempt. Sessions showed the 1200 s
  # deadline once, twice and three times over: 1366 s, ~2400 s and 3465 s. One
  # attempt now costs 1200 s and the caller sees the real error.
  #
  # The cost: a genuine 503 from a Spark box reaches the caller instead of
  # being retried here. The per-model max_retries = 1 in the Grok templates
  # still fires once client-side, and a retry onto the same session-pinned box
  # bought no relocation anyway -- relocation lives on the box, as above.
  model_group_retry_policy:
    agent:
      DefaultRetries: 2
      InternalServerErrorRetries: 2
      ServiceUnavailableErrorRetries: 0
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
    agent-low:
      DefaultRetries: 2
      InternalServerErrorRetries: 2
      ServiceUnavailableErrorRetries: 0
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
    agent-medium:
      DefaultRetries: 2
      InternalServerErrorRetries: 2
      ServiceUnavailableErrorRetries: 0
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
    agent-xhigh:
      DefaultRetries: 2
      InternalServerErrorRetries: 2
      ServiceUnavailableErrorRetries: 0
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
    agent-swarm:
      DefaultRetries: 2
      InternalServerErrorRetries: 2
      ServiceUnavailableErrorRetries: 0
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
    agent-explore:
      DefaultRetries: 2
      InternalServerErrorRetries: 2
      ServiceUnavailableErrorRetries: 0
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
    agent-review:
      DefaultRetries: 2
      InternalServerErrorRetries: 2
      ServiceUnavailableErrorRetries: 0
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
    # The two fast lanes ride the same TensorFold boxes as their parents, so they meet the
    # same status-less NoRoom refusal and the same hung stream, and inherit neither policy:
    # a group picks up nothing from its siblings here.
    agent-xhigh-fast:
      DefaultRetries: 2
      InternalServerErrorRetries: 2
      ServiceUnavailableErrorRetries: 0
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
    agent-swarm-fast:
      DefaultRetries: 2
      InternalServerErrorRetries: 2
      ServiceUnavailableErrorRetries: 0
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
  fallbacks:
    - agent: ["coder"]
    - agent-low: ["coder"]
    - agent-medium: ["coder"]
    - agent-xhigh: ["coder"]
    # The swarm lane degrades one step further than its siblings, and the extra
    # step is worth it here. Its own three deployments can be fully cooled while
    # the SAME boxes are healthy under another alias, because health state,
    # cooldowns and in-flight counters are kept per group - so `agent` is tried
    # first, where least-busy still has a healthy box to pick, and Arc `coder`
    # stays the last resort it is for every other Spark lane. The chain is
    # acyclic: agent-swarm -> agent -> coder, and coder declares no hop of its own.
    - agent-swarm: ["agent", "coder"]
    # The two fan-out lanes degrade the same way the swarm lane does, one step
    # further than the pinned lanes, and each hops through the lane that bakes its
    # own level: a parent that dispatched an explore child at low gets a low answer
    # from the fallback, not an xhigh one it did not ask for. The hop is worth
    # taking for the reason above - these groups' own three deployments can all be
    # cooling while the SAME boxes are healthy under the pinned alias, since health
    # state and cooldowns are kept per group. Both chains are acyclic and end at
    # coder: agent-explore -> agent-low -> coder, agent-review -> agent-xhigh ->
    # coder, and neither fallback lane names a lane that hops back here.
    - agent-explore: ["agent-low", "coder"]
    - agent-review: ["agent-xhigh", "coder"]
    # Each fast lane hops to the lane it is the twin of: same boxes, same baked level, same
    # pin behaviour, so a session that lost its own group keeps everything except the hop's
    # own routing state. Acyclic both ways, and each chain ends at coder like every other.
    - agent-xhigh-fast: ["agent-xhigh", "coder"]
    - agent-swarm-fast: ["agent-swarm", "coder"]
    # The summary lane degrades to a Spark rather than to another Arc alias. coder, coder-fast
    # and chat are all the SAME box as this group, so a hop to them is a hop to whatever is
    # already down; agent-low is the quickest answer the fleet has, which is what a summary
    # was after here in the first place. Acyclic: compaction-fast -> agent-low -> coder.
    - compaction-fast: ["agent-low", "coder"]
