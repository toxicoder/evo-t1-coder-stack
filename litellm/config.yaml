# LiteLLM proxy config for the EVO-T1 stack.
#
# Workspaces and desktops always talk to one OpenAI-compatible base URL
# (http://host.docker.internal:4000/v1) and pick a model alias. Aliases are
# the stable names: "coder" / "coder-fast" / "chat" / "spark-*" for the Arc and
# Ollama paths, "agent" for the tool-capable Spark lane (ONE model group whose
# three deployments are one TensorFold-served inference backend per Spark box),
# and "agent-low" / "agent-medium" / "agent-xhigh" for the same lane with a
# thinking level baked in. `agent` itself already thinks at xhigh.
# Routing inside that group is session-scoped and best-effort: one conversation
# — or one workspace sharing one affinity key — rides the same healthy box
# while that pin stays warm, and a fresh conversation or a request with no
# session id fans out across every reachable box by least-busy. With none
# reachable `agent` falls back to `coder`.
#
# Local models run on the IPEX-LLM Ollama container (Arc 140T, compose
# network only). The spark-* aliases target optional NVIDIA Spark boxes;
# set SPARK1_OLLAMA_URL / SPARK2_OLLAMA_URL in .env to real Ollama hosts.
# The agent alias targets the TensorFold /v1 endpoints those boxes run on
# :8888 (SPARKn_OPENAI_URL, an OpenAI-compatible /v1 endpoint).
#
# One endpoint per box, one box per endpoint. Never point two deployments (or
# two aliases) at the same physical box: the proxy counts deployments, not
# machines — least-busy keeps its in-flight counters per deployment and a
# session pin names one deployment — so two URLs on one box look like spread
# while the conversation stays on a machine that already has work.
#
# Schema note: each entry must be `model_name:` plus a nested `litellm_params:`
# block. LiteLLM hard-indexes both keys at startup (KeyError -> uvicorn exit 3
# -> restart loop), and flat `model:`/`api_base:`/`api_key:` at the entry level
# are accepted as extras and then silently ignored.
model_list:
  # Arc-backed - IPEX-LLM Ollama on the Arc 140T (compose network only).
  # MEASURED LIMITATION for the two Qwen2.5-Coder weights (this runtime is
  # ipex-llm's bundled ollama 0.9.3): a request with `tools` returns the call as
  # plain text with finish_reason "stop" and no tool_calls field, on both
  # /api/chat and /v1/chat/completions, so agent mode cannot drive them. qwen2.5:7b
  # on the same runtime does return a real tool_calls array — the limit is the
  # model, not the runtime.
  - model_name: coder
    litellm_params:
      model: ollama_chat/qwen2.5-coder:32b
      api_base: http://ollama:11434
      api_key: local-arc
    model_info:
      # Qwen2.5-Coder caps at 32k context.
      max_input_tokens: 32768
  - model_name: coder-fast
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://ollama:11434
      api_key: local-arc
    model_info:
      max_input_tokens: 32768
  - model_name: chat
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: http://ollama:11434
      api_key: local-arc
    model_info:
      max_input_tokens: 32768

  # Arc-class models on the Spark boxes, still served over Ollama (optional).
  - model_name: spark-coder
    litellm_params:
      model: ollama_chat/qwen2.5-coder:32b
      api_base: os.environ/SPARK1_OLLAMA_URL
      api_key: local-spark
    model_info:
      max_input_tokens: 32768
  - model_name: spark-chat
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: os.environ/SPARK2_OLLAMA_URL
      api_key: local-spark
    model_info:
      max_input_tokens: 32768

  # Spark-backed agent lane - TensorFold (vLLM-lineage, OpenAI-compatible /v1)
  # serving Qwen3.8-Flash-Next on :8888. THREE deployments in ONE `agent` group,
  # all equal (no `order:` tier): session_affinity pins a session id to one
  # box for as long as that pin stays warm, and least-busy still chooses among
  # the healthy boxes for everything else — a fresh conversation, traffic that
  # carries no session id, and a pinned conversation whose box went unhealthy
  # or into cooldown (that request routes elsewhere, the pin is kept, and the
  # conversation goes back to the box once it is healthy again). Spreading
  # across every reachable box is still the point of running three boxes (5 full
  # 262144-token streams each) — pinning only narrows the candidates first.
  # An `order:` tier would make the tier-2 boxes unreachable while any tier-1
  # box is healthy.
  # Provider prefix is openai/ deliberately: ollama_chat/ would route these
  # through the Ollama-specific code path. api_base must include /v1.
  # `model:` is sent to the backend verbatim and must match the served id
  # byte-for-byte — "Qwen3.8-Flash-Next" with that exact case and hyphens,
  # measured against the live boxes and equal to the recipe's SERVED_NAME
  # default. A wrong id does not crash the proxy: v1.102.1 builds the Router
  # with ignore_invalid_deployments forced to True (not settable from
  # config.yaml), so a bad model id drops that deployment at boot with one
  # log line and later surfaces as "No deployments available", not an error.
  # /health shows every deployment — trust it, not the absence of boot errors.
  # api_key below resolves from SPARKn_API_KEY and MUST be non-empty: v1.102.1
  # fails every request inside the proxy ("The api_key client option must be
  # set...") when it is empty, before the request ever reaches the box. The
  # shipped default is the placeholder `local-spark` — not a secret, ignored
  # by a keyless vLLM/TensorFold backend; replace per box via .env only if
  # that box was started with --api-key.
  # No rpm/tpm/max_parallel_requests caps anywhere on purpose. The proxy's cap
  # chain (rpm -> max_parallel_requests) parks requests behind an in-memory
  # semaphore when a cap is set; with no caps a fully-offered box sheds load
  # in its own scheduler instead of queueing inside the proxy. Session pinning
  # gives part of that spreading back on purpose: one workspace's agent loop can
  # sit on a busy box, and that is the trade — stickiness buys prefix-cache
  # locality and one predictable box for the whole conversation.
  - model_name: agent
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK1_OPENAI_URL
      api_key: os.environ/SPARK_1_API_KEY
      # Baked, not requested: Coder Agents picks `agent` and gets the hard
      # thinking level with it. A `reasoning_effort` in the request still wins.
      reasoning_effort: xhigh
    model_info:
      # v1.102.1 has no `deploy_name` key. Health checks, cooldowns and the
      # least-busy in-flight counters all attribute per deployment via
      # model_info.id, so each box gets a unique id — that is what keeps a
      # cooled box visibly OUT of healthy_deployments instead of blending into
      # the group's aggregate stats.
      id: agent-spark-1
      # Declared so capability lookups and /v1/model/info report tool calling
      # for a model id that is absent from LiteLLM's cost/capability map.
      supports_function_calling: true
      supports_tool_choice: true
      # Inert for routing while enable_pre_call_checks stays off (its
      # default); records the true window for /model_group/info readers.
      max_input_tokens: 262144
  - model_name: agent
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK2_OPENAI_URL
      api_key: os.environ/SPARK_2_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-spark-2
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK3_OPENAI_URL
      api_key: os.environ/SPARK_3_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-spark-3
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144

  # Thinking lanes - the same three boxes, three MORE independent model groups.
  # Qwen3.8-Flash-Next takes low / medium / xhigh and nothing else (there is no
  # `high`), so the thinking level is a name a client picks rather than a knob it
  # turns: `agent` is the default and already bakes xhigh, and these three make
  # the level selectable by alias, from the Coder Agents model dropdown. Each is
  # its own group of three Spark deployments with that level baked into
  # litellm_params, so an entry is still `model_name:` plus a nested
  # `litellm_params:` block like every other entry here.
  #
  # These groups deliberately reuse the SPARKn_OPENAI_URL / SPARK_n_API_KEY pairs
  # that `agent` uses — Coder Agents picking a level must not need more hardware.
  # That is not the "two deployments on one box" mistake warned about above: that
  # warning is about one group counting two URLs on one machine as two boxes.
  # Routing state is per group, so groups are independent — least-busy's counters
  # and the session pin are computed inside a model group, and two chats on
  # different aliases can land on the same box at the same time. What does not
  # change is the box: 5 full 262144-token streams in total, whichever aliases
  # arrive on it, shedding its own overflow in its own scheduler. Still no
  # rpm/tpm/max_parallel_requests on these entries either.
  - model_name: agent-low
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK1_OPENAI_URL
      api_key: os.environ/SPARK_1_API_KEY
      reasoning_effort: low
    model_info:
      # Unique id per deployment, same reason as `agent` above: health checks,
      # cooldowns and the least-busy counters attribute per deployment.
      id: agent-low-spark-1
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-low
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK2_OPENAI_URL
      api_key: os.environ/SPARK_2_API_KEY
      reasoning_effort: low
    model_info:
      id: agent-low-spark-2
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-low
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK3_OPENAI_URL
      api_key: os.environ/SPARK_3_API_KEY
      reasoning_effort: low
    model_info:
      id: agent-low-spark-3
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144

  - model_name: agent-medium
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK1_OPENAI_URL
      api_key: os.environ/SPARK_1_API_KEY
      reasoning_effort: medium
    model_info:
      id: agent-medium-spark-1
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-medium
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK2_OPENAI_URL
      api_key: os.environ/SPARK_2_API_KEY
      reasoning_effort: medium
    model_info:
      id: agent-medium-spark-2
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-medium
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK3_OPENAI_URL
      api_key: os.environ/SPARK_3_API_KEY
      reasoning_effort: medium
    model_info:
      id: agent-medium-spark-3
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144

  - model_name: agent-xhigh
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK1_OPENAI_URL
      api_key: os.environ/SPARK_1_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-xhigh-spark-1
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-xhigh
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK2_OPENAI_URL
      api_key: os.environ/SPARK_2_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-xhigh-spark-2
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144
  - model_name: agent-xhigh
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/SPARK3_OPENAI_URL
      api_key: os.environ/SPARK_3_API_KEY
      reasoning_effort: xhigh
    model_info:
      id: agent-xhigh-spark-3
      supports_function_calling: true
      supports_tool_choice: true
      max_input_tokens: 262144

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # No DB-backed key management, virtual keys, or Admin UI on this box.
  store_model_in_db: false
  # Health checks are the only auto-recovery route: a failing box leaves
  # healthy_deployments (per-deployment attribution via the model_info.id
  # above) until a green probe clears it, and background checks re-probe every
  # health_check_interval seconds so recovery does not wait for user traffic
  # to rediscover the box. health_check_interval and health_check_concurrency
  # MUST sit here: under router_settings the proxy raises ValueError at boot.
  # (store_prompts_in_spend_logs / turn_off_message_logging are not keys in
  # v1.102.1 — do not paste them from newer docs.)
  background_health_checks: true
  # 300 s is LiteLLM's own default, and the concurrency is kept low on purpose. A probe
  # is not a free HEAD: at this tag the proxy sends the deployment's whole litellm_params
  # through ahealth_check into acompletion, so a baked reasoning_effort rides along, and
  # it asks for health_check_max_tokens (default 16). A thinking reply cannot finish its
  # reasoning in 16 tokens, so the probe comes back finish=length with empty content and
  # the server logs a max_tokens warning for it, and the probe still takes a prompt-cache
  # state on a box whose cache sits at 100 percent ("0 MiB spare of 6465 MiB"), evicting a
  # warm conversation prefix that then re-prefills from zero. One log window held 60 such
  # probe replies against real traffic, and the four probes queued behind a long turn were
  # dropped by the proxy's own health-check timeout at ~81 s. Auto-recovery does not need
  # 30 s: a box that is actually down is pulled by allowed_fails/cooldown_time under live
  # traffic, and the re-probe is what brings it back.
  health_check_interval: 300
  health_check_concurrency: 2
  health_check_ignore_transient_errors: true
  # Inert while no request limiter is configured; guardrail if one ever
  # returns: a saturated-and-capped deployment will not collect cross-deployment
  # retries meant for relocation.
  disable_retry_on_max_parallel_request_limit_error: true

litellm_settings:
  drop_params: true
  # Provider-SDK retries and router cross-deployment retries are different
  # things: retrying a saturated box eight times on the SAME deployment buys no
  # relocation and burns tens of minutes. Two retries cover a transient blip;
  # moving off a busy box is routing's job, not the retry chain's.
  num_retries: 2
  # One chain-wide deadline, 1200 s. Long compaction summaries and generations
  # on a saturated Spark outrun a 10-minute read timeout: the Grok CLI's own
  # streaming idle allowance is 1200 s (per model + [models] default in the
  # Grok templates), and a shorter proxy timeout here would cut those calls
  # off with a proxy-side error before the client ever gives up. With both
  # ends at 1200, one slow call may take a full 20 minutes before either end
  # calls it dead.
  request_timeout: 1200
  # Exposes /metrics. Prometheus support is not gated on a premium licence.
  callbacks: ["prometheus"]

# Fallbacks live in router_settings, which takes precedence over the
# litellm_settings equivalent. `agent` degrades to `coder` (Arc, text-only —
# see the measured limitation above) when NO Spark box is healthy; that hop is
# a last resort and shows up in spend logs / per-deployment health instead of
# silently. The old chain `agent -> agent-fast -> coder` existed only because
# agent-fast was a second alias for the SAME model on a second box with a lower
# output ceiling; with one group of three equal deployments, least-busy covers
# that case and the chain collapsed to a single acyclic hop: agent -> coder.
# The three thinking aliases carry the same hop: they go down with exactly the
# same boxes as `agent`, so each degrades to `coder` on its own rather than
# inheriting a hop it does not have.
# (If a concurrency cap is ever reintroduced, its fallback pairing is
# `fallbacks` + `context_window_fallbacks` — both, not one.)
router_settings:
  # Verified in v1.102.1: least-busy picks the healthy deployment with the
  # fewest in-flight requests (per-deployment request counters, 3600 s TTL;
  # health checks, cooldowns and those counters all attribute per deployment,
  # which is why each box carries a unique model_info.id above). It decides
  # only for unpinned traffic: the affinity pin below resolves first, and
  # least-busy runs when nothing is pinned, when the pinned deployment is
  # unhealthy or in cooldown, and for any request with no session id.
  # No routing_strategy_args: its only meaningful child (`ttl`) belongs to the
  # latency-based strategies and least-busy's counter TTL is hardcoded (3600 s).
  # health_check_interval / health_check_concurrency live in general_settings
  # only — under router_settings the proxy raises ValueError at boot.
  routing_strategy: least-busy
  # ON, best-effort: this arms the router's DeploymentAffinityCheck, which pins
  # a session id to one deployment for as long as the pin is warm, so a pinned
  # conversation rides the same box and everything else keeps spreading. The
  # pin idles out after 3600 s without a request and every request refreshes
  # it, so it bounds idle time between requests, not conversation length.
  # Session id sources, in order: `x-litellm-trace-id`, then
  # `x-litellm-session-id`, then any `x-<vendor>-session-id`, then
  # `session-id`/`session_id`/`thread-id`/`conversation_id` (Codex style), then
  # W3C traceparent/baggage, plus body `metadata.session_id`; a value must look
  # like an id (alphanumerics, hyphens, underscores, 8+ chars) to count.
  # Who carries one here: the Grok CLI forwards extra_headers verbatim and the
  # workspace templates render `x-litellm-session-id = "ws-<workspace-uuid>"`
  # under [models] in ~/.grok/config.toml, so one key covers every
  # conversation of a workspace (in shared grok_profile_mode the single shared
  # profile file is re-rendered by the last-booted workspace, which then shares
  # that key across that user's workspaces). Cline/Roo carry none — the
  # extension settings have no custom-header field — and neither does the Coder
  # control-plane chat agent (2.36.6 aibridge forwards no per-conversation and
  # no custom session header); both are spread by least-busy, as intended.
  optional_pre_call_checks: ["session_affinity"]
  allowed_fails: 40
  cooldown_time: 5
  # TensorFold on the Spark boxes answers an over-admitted stream with the Zig
  # error value NoRoom as an HTTP 500 body, and the SDK hands it to LiteLLM with
  # no int status_code. At v1.102.1 that puts it on the status-less branch of
  # exception_mapping_utils, so the router sees APIConnectionError -- and
  # RetryPolicy has no APIConnectionErrorRetries field to catch it. DefaultRetries
  # is the only field that can reach this error, which is why it is set here; do
  # not "clean it up" into a status-coded field.
  #
  # Scoped to the four Spark lanes, so coder (Arc) and chat keep the plain
  # num_retries path. The four groups are independent: none inherits agent's
  # entry, so each needs its own six keys.
  #
  # The zeros pin the exceptions DefaultRetries would otherwise reach, and
  # NotFoundError is one of them: at this tag it has no field of its own, so a
  # typo'd model id would otherwise cost extra attempts before the same error.
  #
  # What this does NOT do: because the exception carries no status_code,
  # _deployment_ids_to_skip_on_retry excludes nothing and
  # _time_to_sleep_before_retry returns 0 while any deployment is healthy, so
  # these retries are instant and, under the workspace-wide session pin, land on
  # the same saturated box. This makes the refusal less likely to surface; the
  # relocation lives on the box (patch 0029 with TF_FLASHNEXT_ADMIT_RECLAIM=1,
  # asserted by //scripts:spark-configure) and in keeping in-flight fan-out at or
  # under a box's PARALLEL, since every subagent of a workspace shares one
  # x-litellm-session-id.
  model_group_retry_policy:
    agent:
      DefaultRetries: 2
      InternalServerErrorRetries: 2
      ServiceUnavailableErrorRetries: 2
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
    agent-low:
      DefaultRetries: 2
      InternalServerErrorRetries: 2
      ServiceUnavailableErrorRetries: 2
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
    agent-medium:
      DefaultRetries: 2
      InternalServerErrorRetries: 2
      ServiceUnavailableErrorRetries: 2
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
    agent-xhigh:
      DefaultRetries: 2
      InternalServerErrorRetries: 2
      ServiceUnavailableErrorRetries: 2
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
  fallbacks:
    - agent: ["coder"]
    - agent-low: ["coder"]
    - agent-medium: ["coder"]
    - agent-xhigh: ["coder"]
