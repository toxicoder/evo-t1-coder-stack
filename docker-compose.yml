# EVO-T1 Coder stack
# GMKtec EVO-T1 — Intel Core Ultra 9 285H, Intel Arc 140T, 96 GB DDR5.
#
# Services:
#   coder           Coder CE control plane (HTTPS UI on host port 3001; Kasm owns 3000)
#   db              Postgres 17 for Coder
#   litellm         LiteLLM proxy (host port 4000) — local Ollama + NVIDIA Spark boxes
#   ollama          IPEX-LLM Ollama on the Arc 140T — container network only,
#                   deliberately NOT published to the host
#   kasm            Kasm Workspaces desktop streaming (wizard :3000 first boot, UI :4443)
#   homepage        gethomepage dashboard — container network only, reached
#                   through the homepage-proxy sidecar
#   homepage-proxy  nginx TLS terminator for the dashboard (host 80 -> 301, 443)
#   router          nginx Host-header router for the public subdomains; the
#                   main Traefik terminates TLS and forwards plain HTTP here
#                   (host STACK_PROXY_HTTP_PORT, default 8080)
#
# Secrets live in .env (see .env.sample). Never commit .env.

services:
  coder:
    image: ghcr.io/coder/coder:v2.36.6
    restart: unless-stopped
    # Optional file, absent by default: create ./coder.env (next to this file,
    # gitignored) only to enable the Coder external-auth broker for GitHub
    # credentials — the one place CODER_EXTERNAL_AUTH_0_* keys may live. The
    # server parses every DEFINED CODER_EXTERNAL_AUTH_* key, empty included,
    # and treats it as a configured provider: an empty one yields provider ""
    # with an invalid id, `coder server` exits with
    # "convert external auth config: ..." and restart: unless-stopped turns
    # that into a crash loop (shipped empty in bf7e36d; crashed live exactly
    # this way). So define the keys here, fully filled, or not at all:
    #   CODER_EXTERNAL_AUTH_0_ID=github
    #   CODER_EXTERNAL_AUTH_0_TYPE=github
    #   CODER_EXTERNAL_AUTH_0_CLIENT_ID=<GitHub OAuth App client id>
    #   CODER_EXTERNAL_AUTH_0_CLIENT_SECRET=<GitHub OAuth App client secret>
    #   CODER_EXTERNAL_AUTH_0_REVOKE_URL=https://github.com/settings/connections/applications/<client id>
    # (an omitted REGEX matches every github.com remote; set it only to tell
    # several providers/hosts apart). Once present, connect your GitHub
    # account in Coder (Settings -> external auth) and each workspace's agent
    # mints SHORT-LIVED per-host tokens on demand via its GIT_ASKPASS
    # helper. The GitHub-side callback URL is
    # <CODER_ACCESS_URL>/external-auth/github/callback, and the App/OAuth
    # grant must INCLUDE the repos workspaces clone: a connected-but-unscoped
    # token authenticates and is still denied on clone/push (403/404) — check
    # that first. `required: false` needs Docker Compose v2.24+ (older
    # compose refuses a missing env file at parse time, loudly).
    env_file:
      - path: ./coder.env
        required: false
    environment:
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:-https://YOUR_LAN_IP:3001}
      CODER_PG_CONNECTION_URL: postgres://coder:${CODER_PG_PASSWORD:-change-me-postgres}@db:5432/coder?sslmode=disable
      # Coder binds 127.0.0.1:3000 by default, which publishes an empty port.
      CODER_HTTP_ADDRESS: "0.0.0.0:3000"
      # TemplateBuilderPage calls crypto.randomUUID(), which browsers only expose
      # in secure contexts: over http://<LAN IP> the page throws
      # "crypto.randomUUID is not a function". Coder terminates TLS itself — no
      # nginx sidecar — on the container port published below.
      CODER_TLS_ENABLE: "true"
      CODER_TLS_ADDRESS: "0.0.0.0:3443"
      # bootstrap.sh issues the pair into proxy/certs/ (SAN: the LAN host,
      # localhost, coder, host.docker.internal).
      CODER_TLS_CERT_FILE: /etc/coder/certs/coder.crt
      CODER_TLS_KEY_FILE: /etc/coder/certs/coder.key
      # Real env var is CODER_TELEMETRY_ENABLE; the _ENABLED spelling is ignored.
      CODER_TELEMETRY_ENABLE: "false"
      # Every name below was checked against codersdk/deployment.go at v2.36.6.
      # The obvious-sounding alternatives (CODER_SESSION_LIFETIME,
      # CODER_PASSWORD_LOGIN_MIN_LENGTH, CODER_HEALTHCHECK_*, CODER_*SHUTDOWN*,
      # CODER_PORT_FORWARDING_ADDRESS, CODER_SSH_GATEWAY_*) do not exist.
      # No reverse proxy here, so the daily outbound release check is pure egress.
      CODER_UPDATE_CHECK: "false"
      # One user on a box also hosting Ollama: 2 daemons leave cores to inference.
      CODER_PROVISIONER_DAEMONS: "2"
      # Defaults are 24h / 7d, which silently logs the CLI and IDE out weekly.
      CODER_SESSION_DURATION: ${CODER_SESSION_DURATION:-720h}
      CODER_DEFAULT_TOKEN_LIFETIME: ${CODER_DEFAULT_TOKEN_LIFETIME:-720h}
      # The server hard-fails at boot unless this is STRICTLY greater than
      # CODER_SESSION_DURATION, so it tracks that value plus a margin. The
      # product default (720h) collides with a 720h session and crash-loops
      # the container — caught by bringing the server up, not by any lint.
      CODER_DEFAULT_OAUTH_REFRESH_LIFETIME: ${CODER_OAUTH_REFRESH_LIFETIME:-8760h}
      # The default 15ms median-query threshold trips when Postgres contends for
      # I/O with a loaded model, and 5 slow probes mark the deployment unhealthy.
      CODER_HEALTH_CHECK_THRESHOLD_DATABASE: ${CODER_HEALTH_CHECK_THRESHOLD_DATABASE:-60ms}
      # Autostop deadlines are clamped to quiet hours, so the timezone is not
      # optional: UTC here force-stops workspaces at the wrong wall-clock hour.
      CODER_QUIET_HOURS_DEFAULT_SCHEDULE: ${CODER_QUIET_HOURS:-CRON_TZ=UTC 0 3 * * *}
      # STUN defaults point at Google and buy nothing on a LAN; agents reach
      # each other directly over WireGuard and DERP stays the fallback.
      CODER_DERP_SERVER_STUN_ADDRESSES: ${CODER_DERP_STUN:-disable}
      # Experiment opt-ins, comma-separated; empty by default = none. Unlike
      # CODER_EXTERNAL_AUTH_* an empty value here is safe (parsed as an empty
      # list), but an UNKNOWN name is no-ops with a warning: v2.36.6 knows no
      # experiment `agents` — that default only logged "ignoring unknown
      # experiment" on every boot, and nothing gates the built-in chat agent
      # anyway — it is compiled into coderd unconditionally, and the
      # `workspace_external_agent` entitlement that the docs name gates
      # EXTERNAL agents (Claude Code, Codex, …), not the chat or the templates
      # here. Real experiment names include `chat-advisor` and
      # `chat-virtual-desktop` if you opt into them here. No AI-Gateway keys
      # on purpose: LiteLLM stays the model transport. scripts/coder-agents.sh
      # --apply wires the chat agent to it server-side (creates the `litellm`
      # provider at http://litellm:4000/v1 with the LITELLM_MASTER_KEY value
      # below, plus model configs, lane pins and the system prompt);
      # LITELLM_BASE_URL/LITELLM_API_KEY already reach workspaces through
      # coder_agent.env for the CLI inside.
      CODER_EXPERIMENTS: ${CODER_EXPERIMENTS:-}
      CODER_PROMETHEUS_ENABLE: "true"
      # Bind inside the container on 0.0.0.0 so the published mapping below can
      # reach it; the host mapping is loopback-only, so metrics never hit the LAN.
      CODER_PROMETHEUS_ADDRESS: "0.0.0.0:2112"
      # No CODER_CACHE_DIRECTORY override: the image already defaults to
      # /home/coder/.cache/coder, and that path sits inside the coder-home
      # volume below, so the Terraform provider cache persists across rebuilds
      # without a second volume. Mounting a fresh named volume there instead
      # makes it root-owned and the server crash-loops on
      # "mkdir /home/coder/.cache/coder/site: permission denied".
    # The image runs as uid 1000, which needs the host docker group to reach the
    # mounted socket. Numeric GID only — the group name does not exist in the
    # image. bootstrap.sh detects it; override DOCKER_GID in .env if it drifts.
    group_add:
      - "${DOCKER_GID:-980}"
    ports:
      # Host port maps to the TLS listener; the plain listener on 3000 stays
      # unpublished for browsers and is what the homepage widget hits via
      # compose DNS.
      - "${CODER_HTTP_PORT:-3001}:3443"
      # Second path to the SAME plain listener, for workspace agents once
      # CODER_ACCESS_URL is a public hostname: the template rewrites the agent
      # URL to host.docker.internal:3002 so agents dial the server over the
      # Docker host gateway instead of hairpinning through the public tunnel
      # (where Authelia would reject the agent's token-only auth).
      - "${CODER_AGENT_TUNNEL_PORT:-3002}:3000"
      # Prometheus scrape endpoint. Bound to loopback so the metrics stay off
      # the LAN, which is also why CODER_PROMETHEUS_ADDRESS binds 0.0.0.0.
      - "127.0.0.1:${CODER_METRICS_PORT:-2112}:2112"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coder-home:/home/coder
      # Plain listener on 3000 stays container-internal; browsers get the TLS port.
      - ./proxy/certs/coder.crt:/etc/coder/certs/coder.crt:ro
      - ./proxy/certs/coder.key:/etc/coder/certs/coder.key:ro
    # SIGINT is what makes the server drain in-flight provisioner jobs; the
    # 30s window keeps `compose down` from SIGKILLing a build mid-apply.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: ${CODER_PG_PASSWORD:-change-me-postgres}
      POSTGRES_DB: coder
    volumes:
      - coder-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder"]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm:
    image: ghcr.io/berriai/litellm:v1.102.1
    restart: unless-stopped
    command: ["--config", "/app/config.yaml"]
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-change-me-litellm}
      SPARK1_OLLAMA_URL: ${SPARK1_OLLAMA_URL:-http://spark-1.lan:11434}
      SPARK2_OLLAMA_URL: ${SPARK2_OLLAMA_URL:-http://spark-2.lan:11434}
      # OpenAI-compatible /v1 endpoints for the ONE `agent` model group: its three
      # deployments are the three URLs below, one per Spark box. Routing is
      # session-pinned first — a request carrying a session id rides the box its
      # pin resolved to for as long as that pin stays warm (1 h idle TTL,
      # refreshed by every request) — and a fresh conversation or any
      # session-id-less request is spread by least-busy across the healthy set.
      # Workspaces carry the pin as a per-workspace `x-litellm-session-id`
      # header, set in the workspace templates. Still no concurrency caps on
      # purpose: a busy box sheds load instead of queueing behind itself. The
      # boxes run TensorFold (a vLLM-lineage, OpenAI-compatible /v1 engine)
      # serving Qwen3.8-Flash-Next, and each may be powered off: with one or two
      # boxes down the group routes around them, with none reachable `agent`
      # falls back to `coder`. The Arc Qwen2.5-Coder weights return tool calls
      # as plain text, so agent mode wants one of these reachable (the Arc
      # `chat` alias is the offline substitute).
      SPARK1_OPENAI_URL: ${SPARK1_OPENAI_URL:-http://spark-1.lan:8888/v1}
      SPARK2_OPENAI_URL: ${SPARK2_OPENAI_URL:-http://spark-2.lan:8888/v1}
      SPARK3_OPENAI_URL: ${SPARK3_OPENAI_URL:-http://spark-3.lan:8888/v1}
      # NOT optional and not secrets: LiteLLM v1.102.1 refuses to build the
      # upstream client when a deployment's api_key is empty, so these carry a
      # placeholder unless the box was started with --api-key (then set the
      # real key per machine here). Verified: an empty value 500s every
      # agent-alias request inside the proxy.
      SPARK_1_API_KEY: ${SPARK_1_API_KEY:-local-spark}
      SPARK_2_API_KEY: ${SPARK_2_API_KEY:-local-spark}
      SPARK_3_API_KEY: ${SPARK_3_API_KEY:-local-spark}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      - ollama

  ollama:
    image: intelanalytics/ipex-llm-inference-cpp-xpu:latest
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    environment:
      DEVICE: Arc
      OLLAMA_NUM_GPU: "999" # offload every layer to the Arc 140T
      ZES_ENABLE_SYSMAN: "1"
      ONEAPI_DEVICE_SELECTOR: level_zero:0
      no_proxy: localhost,127.0.0.1
      OLLAMA_HOST: 0.0.0.0:11434 # compose network only; never published to the host
      OLLAMA_MODELS: /root/.ollama
    # The image's start-ollama.sh backgrounds the server and logs to a file;
    # run `ollama serve` in the foreground here so `docker compose logs` works.
    # Notes (both cost a restart loop when ignored):
    #   - ipex-llm-init is installed by pip into /usr/local/bin, NOT in
    #     /llm/scripts, so resolve it from PATH (no `cd /llm/scripts`).
    #   - it ends in display-var, which echoes variables it leaves unset
    #     (${MALLOC_CONF} is unset on the Arc path), so `set -u` is fatal.
    #   - /llm/ollama is created by start-ollama.sh, which this command
    #     replaces, so mkdir it before cd.
    # init-ollama just symlinks the wheel-bundled ollama into $PWD (offline,
    # idempotent); the probe turns a broken oneAPI runtime into a visible
    # failure, because the ./ollama launcher returns 0 even when ollama-lib
    # cannot load. `set -e` without pipefail is deliberate: pipefail would make
    # the probe pipeline report the loader's status instead of grep's, and the
    # init script's own `grep "cpu cores"` pipeline is a known pipefail tripwire.
    # No shell variables appear below — compose interpolates $name inside
    # command values and would silently blank them out.
    command:
      - bash
      - -lc
      - |
        set -e
        source ipex-llm-init --gpu --device Arc
        mkdir -p /llm/ollama
        cd /llm/ollama
        [ -x ./ollama ] || init-ollama
        if timeout 120 ./ollama-lib --help 2>&1 \
             | grep -qE "error while loading shared libraries|cannot open shared object file|No such file or directory"; then
          echo "FATAL: ./ollama-lib cannot load its shared libraries (oneAPI runtime missing?)" >&2
          exit 1
        fi
        exec ./ollama serve
    shm_size: 16g
    volumes:
      - ollama-models:/root/.ollama

  kasm:
    image: lscr.io/linuxserver/kasm:latest
    restart: unless-stopped
    privileged: true
    security_opt:
      - apparmor:rootlesskit
    environment:
      KASM_PORT: ${KASM_UI_PORT:-4443}
    ports:
      - "${KASM_WIZARD_PORT:-3000}:3000" # first-boot install wizard
      - "${KASM_UI_PORT:-4443}:4443" # Kasm UI after install
    volumes:
      - kasm-data:/opt
    stop_grace_period: 90s

  # The dashboard itself publishes nothing: it is HTTP-only, so browsers reach
  # it only through homepage-proxy. Config lives in git and mounts read-only
  # file by file, which keeps `git diff` the record of dashboard changes.
  #
  # The docker socket stays unmounted on purpose — it is a root-equivalent host
  # credential, and the service cards get their status from each service's own
  # API instead.
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.4.0
    restart: unless-stopped
    environment:
      # Host validation (required since v1.0). Must match the Host header the
      # browser sends; both proxies forward it verbatim, so the LAN host and
      # every public name in STACK_PUBLIC_HOSTS have to be listed here.
      HOMEPAGE_ALLOWED_HOSTS: ${STACK_LAN_HOST:-localhost},localhost,127.0.0.1,homepage${STACK_PUBLIC_HOSTS:+,${STACK_PUBLIC_HOSTS}}
      # NextAuth builds redirects and the Secure-flagged session cookie from this.
      # When the dashboard has a public name it must be the public origin, or the
      # sign-in redirect lands remote users on a LAN address.
      HOMEPAGE_EXTERNAL_URL: ${STACK_DASHBOARD_URL:-https://${STACK_LAN_HOST:-localhost}}
      HOMEPAGE_AUTH_ENABLED: "true"
      HOMEPAGE_AUTH_SECRET: ${HOMEPAGE_AUTH_SECRET:-change-me-homepage-secret}
      HOMEPAGE_AUTH_PASSWORD: ${HOMEPAGE_AUTH_PASSWORD:-change-me-homepage}
      # The image defaults to root; PUID/PGID make the entrypoint drop privileges
      # via su-exec after it has chowned /app/config, so the app writes only as
      # an unprivileged uid.
      PUID: "1000"
      PGID: "1000"
      # HOMEPAGE_VAR_* / HOMEPAGE_FILE_* are substituted into {{...}} tokens in
      # the config files. hrefs use these (browser-reachable); widget urls use
      # compose DNS instead. Each one takes the LAN form unless STACK_PUBLIC_*
      # names a public origin, which bootstrap.sh fills from STACK_PUBLIC_HOSTS
      # — a LAN IP in a card href strands remote users on an unreachable link.
      HOMEPAGE_VAR_CODER_URL: ${STACK_CODER_URL:-https://${STACK_LAN_HOST:-localhost}:${CODER_HTTP_PORT:-3001}}
      HOMEPAGE_VAR_LITELLM_URL: ${STACK_LITELLM_URL:-http://${STACK_LAN_HOST:-localhost}:${LITELLM_PORT:-4000}}
      HOMEPAGE_VAR_KASM_URL: ${STACK_KASM_URL:-https://${STACK_LAN_HOST:-localhost}:${KASM_UI_PORT:-4443}}
      HOMEPAGE_VAR_LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      # The agent backend lives off-box on the LAN, so compose DNS does not
      # apply: the same LAN URL serves both the browser href and the server-side
      # widget fetch. /v1/models is a public endpoint on vLLM — no key needed —
      # and opening it shows which model the alias is actually routing to.
      HOMEPAGE_VAR_AGENT_URL: ${AGENT_MODEL_URL:-http://spark-2.lan:8888/v1/models}
      HOMEPAGE_VAR_AGENT_HEALTH: ${AGENT_MODEL_URL:-http://spark-2.lan:8888/v1/models}
      # Per-box probe URLs for the Spark cards: services.yaml renders one widget
      # per box from these three instead of assuming one "usual" box, so a box
      # that is powered off shows its own card as down. /health is the TensorFold
      # liveness path on :8888 and answers without a key.
      HOMEPAGE_VAR_SPARK1_HEALTH: ${SPARK1_HEALTH_URL:-http://spark-1.lan:8888/health}
      HOMEPAGE_VAR_SPARK2_HEALTH: ${SPARK2_HEALTH_URL:-http://spark-2.lan:8888/health}
      HOMEPAGE_VAR_SPARK3_HEALTH: ${SPARK3_HEALTH_URL:-http://spark-3.lan:8888/health}
    volumes:
      # Each config file mounted read-only individually, which keeps /app/config
      # itself writable. Mounting the directory with :ro breaks startup: the
      # logger mkdirs /app/config/logs and the ENOENT surfaces as a 500 from any
      # route that logs, and a writable volume over that subpath cannot be
      # created inside a read-only bind. New config files (custom.css, etc.)
      # need a line added here.
      - ./homepage/config/settings.yaml:/app/config/settings.yaml:ro
      - ./homepage/config/services.yaml:/app/config/services.yaml:ro
      - ./homepage/config/widgets.yaml:/app/config/widgets.yaml:ro
      - ./homepage/config/bookmarks.yaml:/app/config/bookmarks.yaml:ro
      # custom.css/custom.js come from /app/config, served by the allow-listed
      # /api/config/<name> route (only those two filenames resolve) — NOT from
      # /public. It also styles the sign-in page, so nothing internal goes in it.
      - ./homepage/config/custom.css:/app/config/custom.css:ro
      # Wallpaper and the header logo are served by Next's static handler off
      # /app/public. Both live under icons/, because the auth middleware exempts
      # only /icons/ from the sign-in redirect — /images/ would 307 to /auth/signin
      # and the wallpaper could not load on the login page, which also uses it.
      # Subdirectories only: mounting /app/public itself would shadow the
      # image's own favicons and locales/, and i18n reads /app/public/locales.
      # New files here need `up -d` (a recreate) — `restart` keeps the old
      # mounts, and the in-app config revalidation covers YAML only.
      - ./homepage/assets/icons:/app/public/icons:ro

  homepage-proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_HTTP_PORT:-80}:80"
      - "${HOMEPAGE_HTTPS_PORT:-443}:443"
    volumes:
      # Mounted over the image's own conf.d/default.conf, which is a catch-all
      # welcome-page server that would otherwise win port 80.
      - ./proxy/homepage.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro
    depends_on:
      - homepage

  # Second nginx sidecar for the public subdomains. The main Traefik on another
  # machine terminates TLS for those names and forwards plain HTTP here; this
  # container only routes by Host header (proxy/router.conf), so it publishes
  # one plain-HTTP port and holds no certificate.
  router:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${STACK_PROXY_HTTP_PORT:-8080}:8080"
    volumes:
      # Mounted under its own name, not over default.conf: this container's
      # conf.d holds only this file, so router.conf carries its own
      # `map $http_upgrade` (the one in homepage.conf lives in the other
      # container and is invisible here). The image's welcome server keeps
      # container port 80, which nothing publishes.
      - ./proxy/router.conf:/etc/nginx/conf.d/router.conf:ro
    depends_on:
      - homepage
      - coder
      - litellm
      - kasm

volumes:
  coder-home:
  coder-db:
  ollama-models:
  kasm-data:
