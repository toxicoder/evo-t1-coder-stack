name: Setup Bazel
description: Install Bazelisk and restore disk/repository caches for CI jobs.

inputs:
  install-lint-tools:
    description: Install shellcheck, shfmt, buildifier (and terraform when missing)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Bazelisk comes from images/dev/tool-versions.env (BAZELISK_VERSION) through
    # scripts/lib/tool_pins.sh, so the runner gets the release the golden image builds.
    - name: Install Bazelisk
      shell: bash
      run: |
        set -euo pipefail
        source "${GITHUB_WORKSPACE}/scripts/lib/tool_pins.sh"
        pins="$(tool_pins_file "${GITHUB_WORKSPACE}")"
        arch="$(tool_pins_goarch)" || {
          echo "unsupported arch: $(uname -m)" >&2
          exit 1
        }
        curl -fsSL "$(tool_pins_linux_url "${pins}" bazelisk "${arch}")" \
          -o "${RUNNER_TEMP}/bazelisk"
        chmod +x "${RUNNER_TEMP}/bazelisk"
        mkdir -p "${HOME}/bin"
        install -m 0755 "${RUNNER_TEMP}/bazelisk" "${HOME}/bin/bazelisk"
        echo "${HOME}/bin" >> "${GITHUB_PATH}"
        "${HOME}/bin/bazelisk" version

    - name: Cache Bazel disk and repository cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/bazel-disk
          ~/.cache/bazel-repo
        key: bazel-${{ runner.os }}-${{ github.job }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
        restore-keys: |
          bazel-${{ runner.os }}-${{ github.job }}-
          bazel-${{ runner.os }}-

    - name: Install lint tools
      if: inputs.install-lint-tools == 'true'
      shell: bash
      run: bash .github/scripts/install-lint-tools.sh
