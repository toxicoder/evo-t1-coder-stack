name: ci

# Environments and protection — where the future rules and secrets go:
#   - development / staging / production are GitHub *Environments*, not branches
#     and not Bazel configs. Each environment holds its own protected secrets
#     (a future host-provisioning key, a registry login) and its own protection
#     rules; a job reaches one with `environment: <name>`, so nothing here
#     declares one yet.
#   - `production` stays restricted to `main` — or to tags — with required
#     reviewers, so it can only ever deploy what main already proved.
#   - Branch protection on `main` should require a pull request before pushing
#     and require the checks below to pass before merging.
#
# `main` is the only long-lived branch: it stays green and deployable, and every
# change reaches it through a pull request. See docs/branching.md.
#
# Where the toolchain comes from: both jobs build the golden workspace image
# (images/dev/Dockerfile — the image Coder workspaces boot, and what a
# contributor dev container uses) with buildx and the GHA layer cache, then run
# the gates INSIDE it. shellcheck, shfmt, buildifier, bazelisk and node are the
# image's copies, so a laptop, the contributor container and CI all answer with
# the same versions, and no job installs anything.
#
# Why not `container:` — the image ends at `USER coder`, while the runner mounts
# the checkout at a path only root can write there. Every gate therefore runs
# through `docker run --user root` with $GITHUB_WORKSPACE bind-mounted at /work,
# which is also how scripts/test-in-image.sh runs them on a workstation.
#
# The image is published to ghcr.io from `main` only (packages: write above is
# what lets that push happen; a fork PR has no registry token and never pushes).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # main alone publishes; a fork PR builds from the GHA layer cache and
      # pushes nothing, so it needs no registry credential at all.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build the golden dev image
        uses: docker/build-push-action@v6
        with:
          context: images/dev
          file: images/dev/Dockerfile
          tags: |
            evo-t1-dev:latest
            ghcr.io/${{ github.repository }}/evo-t1-dev:latest
          # Load the build into the runner's daemon so the next step can docker
          # run it; push only where we are allowed to publish.
          load: true
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bazel test-fast, lint and validate in the image
        run: |
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e CI=true -e HOME=/tmp \
            --add-host=host.docker.internal:host-gateway \
            evo-t1-dev:latest \
            bash -lc 'bazelisk test //:test-fast --config=ci && bazelisk test //:lint --config=ci --test_tag_filters=manual && VALIDATE_INNER=1 bazelisk run //:validate'

      - name: Compose and env sample
        run: |
          docker compose config -q
          cmp .env.sample .env.example

  # The exported site is deploy-docs.yml's job; this proves the pages compile, the
  # page contract holds, and nav.json still matches the files on disk. Same image
  # as the bazel job (its build is a GHA layer-cache hit), because the site is
  # built by the node and python the image pins — not by whatever
  # actions/setup-node happens to install.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Load only: the bazel job is the one that publishes on main. Repeating
      # the build here is a GHA layer-cache hit of the same Dockerfile.
      - name: Build the golden dev image
        uses: docker/build-push-action@v6
        with:
          context: images/dev
          file: images/dev/Dockerfile
          tags: evo-t1-dev:latest
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docs site in the image
        run: |
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:/work" -w /work/docs-site \
            -e CI=true -e HOME=/tmp -e NEXT_TELEMETRY_DISABLED=1 \
            evo-t1-dev:latest \
            bash -lc 'npm ci --legacy-peer-deps && npm run typecheck && npm run unit && npm run nav:check && bash run_python_test.sh'
