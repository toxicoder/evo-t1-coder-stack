name: Deploy Documentation

# Publish Fumadocs static exports to gh-pages, one alias per branch.
# - main / master  -> /latest/
# - any other branch -> /<sanitized-ref>/  (feat/foo -> feat-foo)
#
# Each run builds ONE alias: the branch that triggered it. The prefixes it does not
# rebuild are archived out of origin/gh-pages, so a work-branch alias a reader still has
# bookmarked survives every later deploy.
#
# A root index.html forwards bare /evo-t1-coder-stack/ traffic to /latest/.
# Publish goes through scripts/ci/publish-pages-tree.sh, which replaces the whole gh-pages
# tree from a throwaway worktree; doing that in the source checkout would move the branch
# the operator is standing on.
#
# PR docs validation (typecheck, unit, nav:check) lives in ci.yml. This workflow runs on
# push, or by hand.
on:
  push:
    branches: ["**"]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "scripts/ci/publish-pages-tree.sh"
      - "scripts/ci/docs-alias.sh"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs site dependencies
        run: (cd docs-site && npm ci --legacy-peer-deps)

      - name: Resolve the alias for this ref
        id: alias
        run: |
          set -euo pipefail
          alias="$(./scripts/ci/docs-alias.sh "${GITHUB_REF_NAME}")"
          echo "alias=${alias}" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${GITHUB_REF_NAME} as /${alias}/"

      - name: Build and assemble the Pages tree
        env:
          DOCS_ALIAS: ${{ steps.alias.outputs.alias }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Keep every alias this run does not rebuild, so work-branch pages persist.
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            while IFS= read -r prefix; do
              [[ "${prefix}" == "${DOCS_ALIAS}" ]] && continue
              git archive "origin/gh-pages" "${prefix}" | tar -x -C _site
            done < <(git ls-tree --name-only -d origin/gh-pages)
          fi

          rm -rf "_site/${DOCS_ALIAS}"
          mkdir -p "_site/${DOCS_ALIAS}"
          (cd docs-site && npm run build)
          cp -r docs-site/out/. "_site/${DOCS_ALIAS}/"
          # After the cp: verify asserts every nav page exists in the directory it reads.
          # Same DOCS_ALIAS as the build, so the asset prefix it checks is the one it wrote.
          (cd docs-site && npm run verify -- "../_site/${DOCS_ALIAS}")

          touch _site/.nojekyll
          cp docs-site/pages-root-index.html _site/index.html

      - name: Publish to the gh-pages branch
        run: ./scripts/ci/publish-pages-tree.sh _site

      - name: Report the published URLs
        run: |
          {
            echo "## Documentation published"
            echo ""
            echo "| Branch | URL |"
            echo "| --- | --- |"
            echo "| ${GITHUB_REF_NAME} | https://toxicoder.github.io/evo-t1-coder-stack/${DOCS_ALIAS}/ |"
            if [[ "${DOCS_ALIAS}" != "latest" ]]; then
              echo "| latest | https://toxicoder.github.io/evo-t1-coder-stack/latest/ |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DOCS_ALIAS: ${{ steps.alias.outputs.alias }}
